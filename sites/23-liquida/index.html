<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIQUIDA — the oil-slick meditation</title>
<meta name="description" content="LIQUIDA is a full-screen GLSL meditation: metaballs merging in smooth-min, shaded with an iridescent palette. Your cursor stirs it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@200;400;600&display=swap" rel="stylesheet">
<style>
  :root{--txt:#f2f6f4}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#03100e;color:var(--txt);font-family:'Manrope',sans-serif;overflow:hidden}
  ::selection{background:#5ce8c8;color:#03100e}
  #gl{position:fixed;inset:0;width:100%;height:100%}

  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
  header{display:flex;justify-content:space-between;padding:2rem 2.4rem;align-items:baseline}
  .m{font-family:'Prata',serif;font-size:1.3rem;letter-spacing:.34em;text-transform:uppercase}
  nav{pointer-events:auto;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;font-weight:600}
  nav a{color:var(--txt);text-decoration:none;opacity:.7;margin-left:1.8rem;transition:opacity .3s}
  nav a:hover{opacity:1}

  .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem}
  .center h1{
    font-family:'Prata',serif;font-weight:400;
    font-size:clamp(2rem,6vw,4.6rem);line-height:1.3;
    text-shadow:0 2px 60px rgba(3,16,14,.6);
    mix-blend-mode:difference;
  }
  .center h1 em{font-style:italic;letter-spacing:.04em}
  .center .dir{margin-top:2.4rem;font-size:.66rem;letter-spacing:.5em;text-transform:uppercase;opacity:.85;font-weight:600;text-shadow:0 0 8px rgba(4,10,8,.95),0 0 22px rgba(4,10,8,.85),0 1px 2px rgba(4,10,8,.9)}

  footer{display:flex;justify-content:space-between;align-items:flex-end;padding:2rem 2.4rem;
    font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;opacity:.8;font-weight:600;line-height:2.2}
  footer a{color:var(--txt);pointer-events:auto}
  footer .breath{font-family:'Prata',serif;font-size:.95rem;letter-spacing:.2em;text-transform:none;
    font-weight:400;opacity:.9}

  .pulse{position:fixed;z-index:1;width:8px;height:8px;border-radius:50%;background:rgba(242,246,244,.6);
    pointer-events:none;transform:translate(-50%,-50%)}
  @media(max-width:640px){nav a{margin-left:1rem}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="ui">
  <header>
    <span class="m">Liquida</span>
    <nav><a href="guide/">Guide</a><a href="../">Index</a></nav>
  </header>

  <div class="center">
    <div>
      <h1>Nothing here holds<br>its shape, <em>and nothing<br>here is lost.</em></h1>
      <div class="dir" id="dir">move slowly — the slick responds to patience</div>
    </div>
  </div>

  <footer>
    <span>LIQUIDA · SMOOTH-MIN METABALLS<br>ONE FRAGMENT SHADER, ZERO ASSETS</span>
    <span class="breath" id="breath">breathe in…</span>
    <span style="text-align:right">BUILT BY CLAUDE (FABLE 5)<br><a href="guide/">/GUIDE</a> · <a href="../">/INDEX</a></span>
  </footer>
</div>

<script>
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl');
const V=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const F=`
precision highp float;
uniform vec2 u_res;uniform float u_t;uniform vec2 u_m;uniform float u_stir;

float sm(float a,float b,float k){
  float h=clamp(.5+.5*(b-a)/k,0.,1.);
  return mix(b,a,h)-k*h*(1.-h);
}
vec3 pal(float t){
  /* oil-slick iridescence */
  return vec3(.45,.52,.5)+vec3(.45,.4,.45)*cos(6.2831*(vec3(1.,.9,.8)*t+vec3(.1,.35,.6)));
}
void main(){
  vec2 uv=(gl_FragCoord.xy*2.-u_res)/min(u_res.x,u_res.y);
  float t=u_t*.25;

  /* metaball field */
  float d=1e5;
  for(int i=0;i<7;i++){
    float fi=float(i);
    vec2 c=vec2(
      sin(t*(.6+fi*.13)+fi*2.4)*(.55+.1*sin(fi)),
      cos(t*(.5+fi*.11)+fi*1.7)*(.45+.12*cos(fi*2.))
    );
    float r=.16+.09*sin(t+fi*3.1);
    d=sm(d,length(uv-c)-r,.42);
  }
  /* cursor ball */
  float dm=length(uv-u_m)-(.12+.1*u_stir);
  d=sm(d,dm,.5);

  /* fake normal from field gradient */
  float e=.004;
  float dx=d - sm(1e5, length(uv+vec2(e,0.)-u_m)-(.12+.1*u_stir), .5);
  vec2 g=vec2(dFdx(d),dFdy(d));
  float slope=length(g)*140.;

  /* interior shading */
  float inside=smoothstep(.015,-.015,d);
  float depth=exp(d*7.);
  vec3 irid=pal(d*3.2 - t*.42 + uv.x*.3 + uv.y*.2 + slope*.13);
  vec3 deep=vec3(.008,.06,.055);
  vec3 col=mix(deep,irid,inside*depth);

  /* rim light on the edge */
  float rim=smoothstep(.05,.0,abs(d))*smoothstep(-.05,.0,d);
  col+=vec3(.9,1.,.96)*rim*.7;

  /* soft outer glow */
  col+=vec3(.1,.3,.26)*exp(-max(d,0.)*8.)*.35;

  /* vignette */
  vec2 q=gl_FragCoord.xy/u_res;
  col*=1.-.5*pow(length(q-.5),1.7);

  gl_FragColor=vec4(col,1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
/* enable derivatives */
gl.getExtension('OES_standard_derivatives');
const F2=`#extension GL_OES_standard_derivatives : enable\n`+F;
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F2));
gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p');
gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,'u_res'),uT=gl.getUniformLocation(pr,'u_t'),
      uM=gl.getUniformLocation(pr,'u_m'),uS=gl.getUniformLocation(pr,'u_stir');

let mx=0,my=0,tx=0,ty=0,stir=0,lastX=0,lastY=0;
addEventListener('pointermove',e=>{
  const nx=(e.clientX/innerWidth*2-1)*(innerWidth/Math.min(innerWidth,innerHeight));
  const ny=-(e.clientY/innerHeight*2-1)*(innerHeight/Math.min(innerWidth,innerHeight));
  stir=Math.min(1.6,stir+Math.hypot(nx-lastX,ny-lastY)*2.2);
  lastX=nx;lastY=ny;tx=nx;ty=ny;
});
function rs(){
  const d=Math.min(devicePixelRatio,2);
  canvas.width=innerWidth*d;canvas.height=innerHeight*d;
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',rs);rs();
const t0=performance.now();
(function frame(){
  mx+=(tx-mx)*.06;my+=(ty-my)*.06;
  stir*=.965;
  gl.uniform2f(uR,canvas.width,canvas.height);
  gl.uniform1f(uT,(performance.now()-t0)/1000);
  gl.uniform2f(uM,mx,my);
  gl.uniform1f(uS,stir);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
})();

/* breathing text */
const breath=document.getElementById('breath');
setInterval(()=>{
  breath.textContent=breath.textContent==='breathe in…'?'breathe out…':'breathe in…';
},4000);
</script>
</body>
</html>
