<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COPY OF A COPY — a photocopier that degrades beautifully</title>
<meta name="description" content="Press COPY and a light bar sweeps the glass: each generation comes out darker, noisier, more skewed — copy the copy until the poster dissolves into toner. Generation loss as an aesthetic.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23d9d4c8'/%3E%3Crect x='7' y='6' width='18' height='23' fill='%23f5f2ea' stroke='%23222' stroke-width='1.4'/%3E%3Crect x='7' y='14' width='18' height='2.4' fill='%2300b389'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#d9d4c8; --paper:#f5f2ea; --tone:#1c1b18; --dim:#6f6a5e;
  --scan:#00b389; --tape:rgba(28,27,24,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--desk); color:var(--tone); font-family:'Courier Prime',monospace; min-height:100vh;
  display:flex; flex-direction:column; overflow-x:hidden}
::selection{background:var(--scan); color:#03241c}
a:focus-visible,button:focus-visible{outline:2px solid var(--scan); outline-offset:3px}

header{display:flex; justify-content:space-between; align-items:center; padding:1.2rem 1.6rem}
.mark{font-family:'Archivo Black',sans-serif; font-size:.95rem; letter-spacing:.06em; text-transform:uppercase}
.mark em{font-style:normal; color:var(--scan)}
nav{display:flex; gap:1.5rem}
nav a{font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); text-decoration:none}
nav a:hover{color:var(--scan)}

.hero{text-align:center; padding:.6rem 1.2rem 1.6rem}
.hero h1{font-family:'Archivo Black',sans-serif; font-size:clamp(1.5rem,4.4vw,2.6rem); text-transform:uppercase; letter-spacing:.02em}
.hero p{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-top:.5rem}

main{flex:1; display:flex; gap:2.2rem; align-items:flex-start; justify-content:center; flex-wrap:wrap; padding:0 1.4rem 2rem}

.station{display:flex; flex-direction:column; align-items:center; gap:1rem}
.glass{position:relative; box-shadow:0 18px 44px rgba(28,27,24,.28)}
.glass canvas{display:block; background:var(--paper)}
#scanbar{position:absolute; left:0; right:0; top:0; height:3px; background:var(--scan);
  box-shadow:0 0 22px 6px rgba(0,179,137,.55); opacity:0; pointer-events:none}
.tapeTL,.tapeTR{position:absolute; width:74px; height:22px; background:var(--tape); top:-10px}
.tapeTL{left:-18px; transform:rotate(-8deg)} .tapeTR{right:-18px; transform:rotate(7deg)}

.controls{display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center}
button{
  font:inherit; font-size:.68rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  border:2px solid var(--tone); background:var(--paper); color:var(--tone);
  padding:.7rem 1.3rem; cursor:pointer; box-shadow:3px 3px 0 var(--tone); transition:.12s;
}
button:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--tone)}
button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--tone)}
button.go{background:var(--scan); border-color:var(--tone); color:#03241c}
button:disabled{opacity:.5; cursor:wait}

.counter{font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim)}
.counter b{color:var(--tone)}

.tray{display:flex; flex-direction:column; align-items:center; gap:.8rem; max-width:430px}
.tray h2{font-family:'Archivo Black',sans-serif; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase}
#stack{position:relative; width:100%; min-height:340px}
#stack canvas{position:absolute; left:50%; box-shadow:0 10px 26px rgba(28,27,24,.3); background:var(--paper)}

footer{display:flex; justify-content:space-between; flex-wrap:wrap; gap:.6rem; padding:1.2rem 1.6rem;
  font-size:.58rem; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
footer a{color:var(--scan); text-decoration:none}
</style>
</head>
<body>

<header>
  <span class="mark">COPY <em>OF A</em> COPY</span>
  <nav><a href="guide/">Guide</a><a href="../">Index</a></nav>
</header>

<div class="hero">
  <h1>Generation loss, on purpose.</h1>
  <p>press copy · each generation degrades · copy the copy</p>
</div>

<main>
  <div class="station">
    <div class="glass">
      <span class="tapeTL"></span><span class="tapeTR"></span>
      <canvas id="glassCv" width="360" height="480" aria-label="The photocopier glass holding the current poster"></canvas>
      <div id="scanbar"></div>
    </div>
    <div class="controls">
      <button class="go" id="bCopy">▮ copy</button>
      <button id="bAdopt">use last copy as original</button>
      <button id="bReset">fresh original</button>
    </div>
    <span class="counter">generation <b id="gen">0</b> · fidelity <b id="fid">100%</b></span>
  </div>

  <div class="tray">
    <h2>— output tray —</h2>
    <div id="stack"></div>
  </div>
</main>

<footer>
  <span>site 82 / fable 25 · built by claude (fable 5)</span>
  <span><a href="guide/">how it was made</a></span>
</footer>

<script>
/* ═════ COPY OF A COPY — photocopier degradation engine ═════
   The "original" is a procedurally drawn poster. Each COPY:
   1. sweeps the scan bar down the glass
   2. re-renders the source through a degradation pass — contrast crush,
      toner noise, streaks, slight rotation/offset, edge darkening
   3. drops the print into the output tray
   ADOPT swaps the latest copy in as the new original, so loss compounds. */

const glass = document.getElementById('glassCv');
const gx = glass.getContext('2d');
const W = glass.width, H = glass.height;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* — the pristine original poster (pure canvas, no assets) — */
function drawOriginal(x){
  x.fillStyle='#f5f2ea'; x.fillRect(0,0,W,H);
  x.fillStyle='#1c1b18';
  x.font='900 64px "Archivo Black", sans-serif';
  x.textAlign='center';
  x.fillText('LOST', W/2, 96);
  x.fillText('&', W/2, 168);
  x.fillText('FOUND', W/2, 240);
  x.font='700 15px "Courier Prime", monospace';
  x.fillText('DEPARTMENT OF MISLAID THINGS', W/2, 286);
  x.strokeStyle='#1c1b18'; x.lineWidth=3;
  x.strokeRect(24,24,W-48,H-48);
  x.beginPath(); x.arc(W/2, 372, 52, 0, 7); x.stroke();
  x.beginPath(); x.arc(W/2-14, 362, 8, 0, 7); x.fill();
  x.beginPath(); x.arc(W/2+14, 362, 8, 0, 7); x.fill();
  x.beginPath(); x.arc(W/2, 388, 22, 3.5, 5.9); x.stroke();   // sad mouth
  x.font='700 12px "Courier Prime", monospace';
  x.fillText('IF FOUND, KEEP IT. IT LIKES YOU NOW.', W/2, 452);
}

let original = document.createElement('canvas');
original.width=W; original.height=H;
drawOriginal(original.getContext('2d'));

let gen = 0;
let lastCopy = null;
const genEl=document.getElementById('gen'), fidEl=document.getElementById('fid');

function present(){
  gx.clearRect(0,0,W,H);
  gx.drawImage(original,0,0);
  genEl.textContent = gen;
  fidEl.textContent = Math.max(2, Math.round(100*Math.pow(.82,gen))) + '%';
}
present();

/* — degradation pass — */
function degrade(srcCanvas){
  const out = document.createElement('canvas');
  out.width=W; out.height=H;
  const o = out.getContext('2d');

  // slight skew + offset, like a sloppy feed
  o.fillStyle='#f5f2ea'; o.fillRect(0,0,W,H);
  o.save();
  o.translate(W/2 + (Math.random()*8-4), H/2 + (Math.random()*8-4));
  o.rotate((Math.random()*2-1)*.014);
  o.scale(1 + (Math.random()*.02-.01), 1 + (Math.random()*.02-.01));
  o.drawImage(srcCanvas, -W/2, -H/2);
  o.restore();

  const img = o.getImageData(0,0,W,H);
  const d = img.data;
  const streakX = [];
  for (let s=0;s<3;s++) streakX.push((Math.random()*W)|0);

  for (let i=0;i<d.length;i+=4){
    let v = (d[i]+d[i+1]+d[i+2])/3;
    // contrast crush toward toner: midtones die first
    v = v < 150 ? v*.82 : Math.min(255, v*1.06 + 8);
    // toner noise
    const n = (Math.random()-.5)*46;
    v += n;
    // vertical streaks
    const px = (i/4)%W;
    for (const sx of streakX) if (Math.abs(px-sx) < 2) v -= 34;
    // edge vignette (drum wear)
    const py = ((i/4)/W)|0;
    const ex = Math.min(px, W-px)/W, ey = Math.min(py, H-py)/H;
    v -= Math.max(0, .06 - Math.min(ex,ey)) * 480;
    v = Math.max(0, Math.min(255, v));
    // sepia-ish paper: keep in warm gray
    d[i] = v; d[i+1] = v*.99; d[i+2] = v*.95;
  }
  o.putImageData(img,0,0);
  return out;
}

/* — the copy ritual — */
const bar = document.getElementById('scanbar');
const bCopy = document.getElementById('bCopy');
const stack = document.getElementById('stack');
let copies = 0;

function copy(){
  bCopy.disabled = true;
  const doPrint = () => {
    gen += 1;
    lastCopy = degrade(original);
    // print lands in the tray
    const print = document.createElement('canvas');
    print.width=W; print.height=H;
    print.getContext('2d').drawImage(lastCopy,0,0);
    const scale = .46;
    print.style.width = W*scale+'px';
    print.style.top = Math.min(copies, 6)*26 + 'px';
    print.style.transform = `translateX(-50%) rotate(${(Math.random()*6-3).toFixed(1)}deg)`;
    stack.appendChild(print);
    copies++;
    if (stack.children.length > 8) stack.removeChild(stack.firstChild);
    genEl.textContent = gen;
    fidEl.textContent = Math.max(2, Math.round(100*Math.pow(.82,gen))) + '%';
    bCopy.disabled = false;
  };
  if (reduce){ doPrint(); return; }
  bar.style.opacity = 1;
  bar.animate(
    [{ top:'0px' }, { top: (H-3)+'px' }],
    { duration: 1100, easing:'cubic-bezier(.4,0,.6,1)' }
  ).onfinish = () => { bar.style.opacity = 0; doPrint(); };
}
bCopy.addEventListener('click', copy);

document.getElementById('bAdopt').addEventListener('click', ()=>{
  if (!lastCopy) return;
  original = lastCopy;
  present();
});
document.getElementById('bReset').addEventListener('click', ()=>{
  original = document.createElement('canvas');
  original.width=W; original.height=H;
  drawOriginal(original.getContext('2d'));
  gen = 0; lastCopy = null; copies = 0;
  stack.innerHTML = '';
  present();
});
</script>
</body>
</html>
