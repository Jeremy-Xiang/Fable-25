<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE WIND ATLAS — ten thousand particles reading the air</title>
<meta name="description" content="A flow-field painting: particles ride a drifting noise field and leave luminous trails. Your cursor is a weather front — it bends the wind around itself.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071210'/%3E%3Cpath d='M6 16 Q12 10 18 15 T28 13' fill='none' stroke='%236fe3c1' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --ink:#e9f5ef; --dim:#7fa295; --dim2:#48645b; --mint:#6fe3c1; --line:rgba(233,245,239,.12); }
*{box-sizing:border-box;margin:0;padding:0}
body{background:#071210; color:var(--ink); font-family:'Space Grotesk',sans-serif; overflow:hidden; height:100vh}
::selection{background:var(--mint); color:#03211a}
a:focus-visible,button:focus-visible{outline:2px solid var(--mint); outline-offset:3px}

#field{position:fixed; inset:0; width:100%; height:100%}

header{position:fixed; top:0; left:0; right:0; z-index:5; display:flex; justify-content:space-between;
  padding:1.3rem 1.6rem; pointer-events:none}
header .mark, header nav a{pointer-events:auto}
.mark{font-family:'Fraunces',serif; font-weight:600; font-size:1rem; letter-spacing:.04em}
.mark i{color:var(--mint); font-style:italic}
nav{display:flex; gap:1.5rem}
nav a{font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); text-decoration:none}
nav a:hover{color:var(--mint)}

.plate{position:fixed; left:1.6rem; bottom:1.4rem; z-index:5; pointer-events:none; max-width:22rem}
.plate h1{font-family:'Fraunces',serif; font-weight:300; font-size:clamp(1.5rem,3.4vw,2.3rem); line-height:1.2}
.plate h1 em{font-style:italic; color:var(--mint)}
.plate p{font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim2); margin-top:.8rem; line-height:1.9}

.panel{position:fixed; right:1.6rem; bottom:1.4rem; z-index:5; display:flex; flex-direction:column; gap:.7rem; align-items:flex-end}
.panel .grp{display:flex; align-items:center; gap:.6rem}
.panel label{font-size:.58rem; letter-spacing:.18em; text-transform:uppercase; color:var(--dim2)}
.panel label b{color:var(--mint); font-weight:500}
input[type=range]{-webkit-appearance:none; appearance:none; width:110px; height:2px; background:var(--line); border-radius:2px; cursor:ew-resize}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--mint)}
input[type=range]::-moz-range-thumb{width:12px; height:12px; border:none; border-radius:50%; background:var(--mint)}
.panel button{font:inherit; font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
  background:none; border:1px solid var(--line); border-radius:999px; padding:.45rem .9rem; cursor:pointer}
.panel button:hover{color:var(--mint); border-color:var(--mint)}
@media(max-width:700px){.panel{display:none}}
</style>
</head>
<body>

<canvas id="field" aria-label="Flow-field particle painting; move the cursor to bend the wind"></canvas>

<header>
  <span class="mark">the wind <i>atlas</i></span>
  <nav><a href="guide/">Guide</a><a href="../">Index</a></nav>
</header>

<div class="plate">
  <h1>Ten thousand particles,<br><em>reading the air.</em></h1>
  <p>curl-ish noise field · additive trails<br>your cursor is a weather front</p>
</div>

<div class="panel" role="group" aria-label="Field controls">
  <div class="grp"><label>Wind speed <b id="vSpd">1.0</b></label><input type="range" id="rSpd" min="30" max="240" value="100"></div>
  <div class="grp"><label>Turbulence <b id="vTur">1.6</b></label><input type="range" id="rTur" min="60" max="340" value="160"></div>
  <div class="grp"><button id="bInk">cycle palette</button><button id="bClear">clear canvas</button></div>
</div>

<script>
const cv = document.getElementById('field');
const x = cv.getContext('2d', { alpha:false });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

const CFG = { speed:1.0, turb:1.6 };
const N = coarse ? 3200 : 9000;

let W,H;
function resize(){
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
  x.fillStyle = '#071210'; x.fillRect(0,0,W,H);
}
addEventListener('resize', resize); resize();

/* value-noise (cheap, seeded) for the vector field */
const P = new Uint8Array(512);
for (let i=0;i<256;i++) P[i]=i;
for (let i=255;i>0;i--){ const j=(Math.random()*(i+1))|0; [P[i],P[j]]=[P[j],P[i]]; }
for (let i=0;i<256;i++) P[256+i]=P[i];
function fade(t){ return t*t*t*(t*(t*6-15)+10); }
function grad(h,xx,yy){ return ((h&1)?xx:-xx) + ((h&2)?yy:-yy); }
function noise(xx,yy){
  const X=Math.floor(xx)&255, Y=Math.floor(yy)&255;
  xx-=Math.floor(xx); yy-=Math.floor(yy);
  const u=fade(xx), v=fade(yy);
  const a=P[P[X]+Y], b=P[P[X+1]+Y], c=P[P[X]+Y+1], d=P[P[X+1]+Y+1];
  return ( (1-v)*((1-u)*grad(a,xx,yy)+u*grad(b,xx-1,yy))
         + v*((1-u)*grad(c,xx,yy-1)+u*grad(d,xx-1,yy-1)) ) * .7;
}

/* palettes: [trailHue base, accent] as hsl h values */
const PALETTES = [
  { name:'lagoon', h1:160, h2:190 },
  { name:'ember',  h1:18,  h2:45 },
  { name:'violet', h1:265, h2:300 },
  { name:'arctic', h1:200, h2:230 },
];
let pal = 0;

const parts = new Float32Array(N*3); // x, y, age
function seed(i){
  parts[i*3]   = Math.random()*W;
  parts[i*3+1] = Math.random()*H;
  parts[i*3+2] = 40 + Math.random()*160;
}
for (let i=0;i<N;i++) seed(i);

let mx=-9999, my=-9999;
addEventListener('pointermove', e=>{ mx=e.clientX; my=e.clientY; });
addEventListener('pointerleave', ()=>{ mx=my=-9999; });

let t = Math.random()*100;
function frame(){
  requestAnimationFrame(frame);
  if (reduce && t > 106) return;            // settle to a finished painting
  t += .0022 * CFG.speed;

  // fade slightly toward background for glowing trails
  x.fillStyle = 'rgba(7,18,16,.045)';
  x.fillRect(0,0,W,H);

  const { h1, h2 } = PALETTES[pal];
  const s = 0.0016 * CFG.turb;
  for (let i=0;i<N;i++){
    let px = parts[i*3], py = parts[i*3+1];
    let a = noise(px*s, py*s + t) * Math.PI * 2.6;

    // cursor = weather front: bend flow around a pressure bubble
    const dx = px-mx, dy = py-my;
    const dd = dx*dx + dy*dy;
    if (dd < 32400){                        // 180px radius
      const push = (1 - Math.sqrt(dd)/180) * 2.2;
      a += Math.atan2(dy, dx) * 0 + push * (dx*Math.sin(a) - dy*Math.cos(a) > 0 ? 1 : -1) * .9;
    }

    const sp = (1.2 + noise(py*s, px*s - t)*1.2) * CFG.speed;
    const nx = px + Math.cos(a)*sp;
    const ny = py + Math.sin(a)*sp;

    const hue = h1 + (h2-h1) * (0.5 + 0.5*Math.sin(px*0.002 + t*2));
    x.strokeStyle = `hsla(${hue},72%,62%,.30)`;
    x.beginPath(); x.moveTo(px,py); x.lineTo(nx,ny); x.stroke();

    parts[i*3]=nx; parts[i*3+1]=ny;
    if ((parts[i*3+2] -= 1) < 0 || nx<-4||nx>W+4||ny<-4||ny>H+4) seed(i);
  }
}
requestAnimationFrame(frame);

/* panel */
document.getElementById('rSpd').addEventListener('input', e=>{
  CFG.speed = e.target.value/100;
  document.getElementById('vSpd').textContent = CFG.speed.toFixed(1);
});
document.getElementById('rTur').addEventListener('input', e=>{
  CFG.turb = e.target.value/100;
  document.getElementById('vTur').textContent = CFG.turb.toFixed(1);
});
document.getElementById('bInk').addEventListener('click', ()=>{ pal = (pal+1)%PALETTES.length; });
document.getElementById('bClear').addEventListener('click', ()=>{
  x.fillStyle='#071210'; x.fillRect(0,0,W,H);
});
</script>
</body>
</html>
