<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLATEN — a typewriter with no backspace</title>
<meta name="description" content="A mechanical typewriter in the browser: every key strikes slightly crooked, the ink runs uneven, the bell rings at the margin, and nothing can be deleted — only struck through.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b2a27'/%3E%3Crect x='7' y='5' width='18' height='14' fill='%23f4efe4'/%3E%3Crect x='5' y='19' width='22' height='8' rx='2' fill='%23b0392b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#2b2a27;--paper:#f4efe4;--ink:#1d1b18;--dim:#a39c8e;--red:#b0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(80% 60% at 50% 0%,#3a3833,var(--desk));color:var(--paper);font-family:'Courier Prime',monospace;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
::selection{background:var(--red);color:#fff}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem}
.mark{font-family:'Special Elite',monospace;font-size:1.15rem;letter-spacing:.14em}
.mark em{font-style:normal;color:#e06a5a}
nav{display:flex;gap:1.4rem}
nav a{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:#e06a5a}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:.4rem 1rem 1.2rem;gap:1rem}
.hint{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-align:center}
.hint b{color:var(--paper);font-weight:700}
#sheet{position:relative;width:min(680px,94vw);min-height:62vh;background:var(--paper);color:var(--ink);padding:54px 46px 60px;box-shadow:0 24px 60px rgba(0,0,0,.55);cursor:text;
  background-image:linear-gradient(rgba(29,27,24,.03) 1px,transparent 1px);background-size:100% 30px}
#sheet:focus{outline:none;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 2px rgba(224,106,90,.55)}
.ln{height:30px;white-space:pre;font-family:'Special Elite',monospace;font-size:19px;line-height:30px;position:relative}
.ch{display:inline-block;width:11.6px;text-align:center}
#caret{position:absolute;width:11.6px;height:3px;background:var(--red);transition:left .05s,top .05s}
#trap{position:absolute;opacity:0;pointer-events:none;height:1px;width:1px}
.deck{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.deck button{font:inherit;font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:none;border:1.5px solid var(--dim);color:var(--paper);padding:.55rem 1rem;cursor:pointer}
.deck button:hover,.deck button.on{border-color:#e06a5a;color:#e06a5a}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem;padding:.6rem 1.5rem 1.2rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
footer a{color:#e06a5a;text-decoration:none}
</style>
</head>
<body>
<header><span class="mark">PLA<em>TEN</em></span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<main>
  <p class="hint">click the page and <b>type</b> · backspace only moves the carriage · <b>enter</b> returns it</p>
  <div id="sheet" tabindex="0" role="textbox" aria-label="Typewriter page; type to strike letters"><div id="caret"></div><input id="trap" autocapitalize="off" autocomplete="off"></div>
  <div class="deck"><button id="bSnd">sound: off</button><button id="bNew">fresh sheet</button></div>
</main>
<footer><span>site 108 / fable 25 · built by claude (fable 5)</span><span><a href="guide/">how it was made</a></span></footer>
<script>
const sheet=document.getElementById('sheet'),caret=document.getElementById('caret'),trap=document.getElementById('trap');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLS=50,CW=11.6,LH=30,PADX=46,PADY=54;
let lines=[],row=0,col=0,snd=false,ac=null;
function line(i){while(lines.length<=i){const d=document.createElement('div');d.className='ln';sheet.appendChild(d);lines.push(d)}return lines[i]}
function place(){caret.style.left=(PADX+col*CW)+'px';caret.style.top=(PADY+row*LH+24)+'px'}
function click(freq,dur,vol,type){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=freq;
  g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function strike(ch){
  if(col>=COLS)ret();
  const s=document.createElement('span');s.className='ch';s.textContent=ch;
  // every strike lands a little wrong: baseline drift, rotation, uneven ink
  s.style.position='absolute';s.style.left=(col*CW+(Math.random()-.5)*1.4)+'px';s.style.top=((Math.random()-.5)*2.2)+'px';
  s.style.transform=`rotate(${(Math.random()-.5)*5}deg)`;s.style.opacity=(.62+Math.random()*.38).toFixed(2);
  if(Math.random()<.06)s.style.color='#3a3530';
  line(row).appendChild(s);col++;
  click(180+Math.random()*60,.035,.12);
  if(col===COLS-6)click(1750,.5,.1,'sine');   // margin bell
  place()}
function ret(){row++;col=0;line(row);click(90,.12,.14,'sawtooth');place();
  if(PADY+row*LH+LH+60>sheet.clientHeight)sheet.style.minHeight=(PADY+row*LH+LH+90)+'px'}
function key(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Enter'){e.preventDefault();ret()}
  else if(e.key==='Backspace'){e.preventDefault();if(col>0){col--;place();click(120,.03,.08)}}
  else if(e.key===' '){e.preventDefault();col++;if(col>COLS)ret();place();click(140,.03,.08)}
  else if(e.key.length===1){e.preventDefault();strike(e.key)}
  demo=false}
sheet.addEventListener('keydown',key);
sheet.addEventListener('pointerdown',()=>{sheet.focus()});
// the machine writes its own letter until you take the keys
const LETTER='Dear reader,\n\nThis page has no backspace. Every letter\nyou strike stays struck, slightly crooked,\nthe way things were before undo.\n\nThe keys are yours now. Type something\nyou would not mind keeping.';
let demo=true,di=0;
function auto(){if(!demo||di>=LETTER.length)return;const c=LETTER[di++];if(c==='\n')ret();else if(c===' '){col++;place()}else strike(c);setTimeout(auto,reduce?0:55+Math.random()*90)}
function fresh(){lines.forEach(l=>l.remove());lines=[];row=0;col=0;line(0);place()}
line(0);place();setTimeout(auto,reduce?0:600);
const bS=document.getElementById('bSnd');bS.addEventListener('click',()=>{snd=!snd;bS.textContent='sound: '+(snd?'on':'off');bS.classList.toggle('on',snd);sheet.focus()});
document.getElementById('bNew').addEventListener('click',()=>{demo=false;fresh();sheet.focus()});
</script>
</body>
</html>
