<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTAGION — how something spreads through a network</title>
<meta name="description" content="An epidemic model on a contact network: click anyone to start an outbreak and watch it travel link by link. Raise the share of immune people and see the same spark fail to catch.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f3f1ec'/%3E%3Cpath d='M8 9 L16 16 L25 10 M16 16 L12 25 M16 16 L24 23' stroke='%23999' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e5383b'/%3E%3Ccircle cx='8' cy='9' r='2.6' fill='%23e5383b'/%3E%3Ccircle cx='25' cy='10' r='2.6' fill='%23999'/%3E%3Ccircle cx='12' cy='25' r='2.6' fill='%232a9d8f'/%3E%3Ccircle cx='24' cy='23' r='2.6' fill='%23999'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;900&family=Libre+Baskerville:ital@1&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--ink:#1a1a1a;--dim:#7c7a75;--red:#e5383b;--teal:#2a9d8f;--line:rgba(26,26,26,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;height:100vh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
::selection{background:var(--red);color:#fff}
a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.6rem;border-bottom:1px solid var(--ink)}
.mark{font-weight:900;font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase}
nav{display:flex;gap:1.4rem}
nav a{font-family:'Roboto Mono',monospace;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:var(--red)}
main{display:grid;grid-template-columns:minmax(0,330px) 1fr;min-height:0}
aside{padding:1.4rem 1.6rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.2rem;overflow:auto}
h1{font-weight:900;font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.02;letter-spacing:-.02em}
h1 em{font-family:'Libre Baskerville',serif;font-weight:400;color:var(--red)}
.lede{font-size:.88rem;line-height:1.55;color:#48463f;margin:.9rem 0 1.2rem}
label{font-family:'Roboto Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
label b{color:var(--ink);font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--line);margin:.7rem 0 1.1rem}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--ink)}
#chart{width:100%;height:110px;display:block;border:1px solid var(--line);background:#fbfaf7}
.nums{display:flex;gap:1rem;font-family:'Roboto Mono',monospace;font-size:.66rem;margin:.7rem 0 .9rem;flex-wrap:wrap}
.nums span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.4rem;background:var(--c)}
button{font-family:'Roboto Mono',monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--bg);border:none;padding:.7rem 1rem;cursor:pointer;align-self:flex-start}
button:hover{background:var(--red)}
.cred{font-family:'Roboto Mono',monospace;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:auto;padding-top:1rem;line-height:1.7}
.cred a{color:var(--red)}
.wrap{min-height:0;min-width:0}
#c{width:100%;height:100%;display:block;cursor:pointer}
@media(max-width:820px){body{height:auto;min-height:100vh;overflow:auto}main{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}.wrap{height:90vw}}
</style>
</head>
<body>
<header><span class="mark">Contagion</span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<main>
  <aside>
    <h1>How something <em>spreads.</em></h1>
    <p class="lede">Two hundred people, linked to whoever lives near them. Click anyone to start an outbreak. A toy model, not a forecast.</p>
    <label for="rB">chance to pass it on, per contact per day <b id="vB">17%</b></label><input type="range" id="rB" min="1" max="40" value="17">
    <label for="rV">already immune <b id="vV">0%</b></label><input type="range" id="rV" min="0" max="90" value="0" step="5">
    <canvas id="chart" aria-label="Chart of susceptible, infected and recovered over time"></canvas>
    <div class="nums"><span style="--c:#b9b5ac" id="nS">–</span><span style="--c:#e5383b" id="nI">–</span><span style="--c:#264653" id="nR">–</span><span style="--c:#2a9d8f" id="nV">–</span></div>
    <button id="again">new town</button>
    <div class="cred">site 141 / fable 25 · built by claude (fable 5) · <a href="guide/">how it was made</a></div>
  </aside>
  <div class="wrap"><canvas id="c" aria-label="Contact network; click a person to infect them"></canvas></div>
</main>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),ch=document.getElementById('chart'),cx=ch.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=200;let W,H,D,P=[],E=[],beta=.17,vacc=0,hist=[],day=0,acc=0,idle=0,user=false;
// state: 0 susceptible, 1 infected, 2 recovered, 3 immune from the start
function resize(){D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);ch.width=ch.clientWidth*D;ch.height=ch.clientHeight*D;cx.setTransform(D,0,0,D,0,0)}
function town(){P=[];E=[];let tries=0;const minD=Math.sqrt(W*H/N)*.62;while(P.length<N&&tries++<20000){const p={x:30+Math.random()*(W-60),y:30+Math.random()*(H-60),s:0,t:0,nb:[]};if(P.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>minD))P.push(p)}
  // link each person to their three nearest, plus a few long-distance friendships
  P.forEach((p,i)=>{const near=P.map((q,j)=>[Math.hypot(q.x-p.x,q.y-p.y),j]).sort((a,b)=>a[0]-b[0]).slice(1,4);for(const[,j]of near)if(!p.nb.includes(P[j])){p.nb.push(P[j]);P[j].nb.push(p);E.push([p,P[j],0])}});
  for(let i=0;i<10;i++){const a=P[Math.random()*P.length|0],b=P[Math.random()*P.length|0];if(a!==b&&!a.nb.includes(b)){a.nb.push(b);b.nb.push(a);E.push([a,b,1])}}reset()}
function reset(){for(const p of P){p.s=0;p.t=0}const k=Math.round(P.length*vacc);[...P].sort(()=>Math.random()-.5).slice(0,k).forEach(p=>p.s=3);hist=[];day=0;idle=0;tally()}
function infect(p){if(p&&p.s===0){p.s=1;p.t=0}}
function stepDay(){day++;const fresh=[];for(const p of P)if(p.s===1){for(const q of p.nb)if(q.s===0&&Math.random()<beta)fresh.push(q);if(++p.t>=8)p.s=2}fresh.forEach(infect);tally()}
function tally(){const c=[0,0,0,0];for(const p of P)c[p.s]++;hist.push(c);if(hist.length>220)hist.shift();
  document.getElementById('nS').textContent=c[0]+' well';document.getElementById('nI').textContent=c[1]+' ill';document.getElementById('nR').textContent=c[2]+' recovered';document.getElementById('nV').textContent=c[3]+' immune';return c}
const COL=['#b9b5ac','#e5383b','#264653','#2a9d8f'];
function draw(){x.clearRect(0,0,W,H);
  for(const[a,b,long]of E){const live=(a.s===1&&b.s===0)||(b.s===1&&a.s===0);x.strokeStyle=live?'rgba(229,56,59,.8)':long?'rgba(26,26,26,.16)':'rgba(26,26,26,.22)';x.lineWidth=live?1.6:1;if(long)x.setLineDash([4,5]);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.setLineDash([])}
  for(const p of P){x.fillStyle=COL[p.s];x.beginPath();x.arc(p.x,p.y,p.s===1?6:4.6,0,7);x.fill();if(p.s===1){x.strokeStyle='rgba(229,56,59,.35)';x.lineWidth=1;x.beginPath();x.arc(p.x,p.y,7+p.t*1.2,0,7);x.stroke()}}
  const w=ch.clientWidth,h=ch.clientHeight;cx.clearRect(0,0,w,h);if(hist.length>1){const n=hist.length,sx=w/Math.max(60,n-1);
    for(const[k,col]of[[0,'#b9b5ac'],[2,'#264653'],[1,'#e5383b']]){cx.strokeStyle=col;cx.lineWidth=k===1?2.2:1.4;cx.beginPath();hist.forEach((c,i)=>{const y=h-4-c[k]/N*(h-8);i?cx.lineTo(i*sx,y):cx.moveTo(i*sx,y)});cx.stroke()}}}
function frame(){requestAnimationFrame(frame);if(++acc>=7){acc=0;const c=hist[hist.length-1];if(c&&c[1]>0)stepDay();else if(!user&&++idle>18){reset();infect(P.filter(p=>p.s===0)[Math.random()*10|0])}}draw()}
function runOut(){let g=0;while(hist[hist.length-1][1]>0&&g++<400)stepDay();draw()}
addEventListener('resize',()=>{resize();town();infect(P[0]);if(reduce)runOut()});resize();town();infect(P[N/2|0]);
if(reduce)runOut();else{for(let i=0;i<22;i++)stepDay();requestAnimationFrame(frame)}
cv.addEventListener('click',e=>{user=true;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let b=null,bd=900;for(const p of P){const d=(p.x-mx)**2+(p.y-my)**2;if(d<bd){bd=d;b=p}}
  if(b){if(hist[hist.length-1][1]===0&&day>0)reset();infect(b);tally();if(reduce)runOut()}});
document.getElementById('rB').addEventListener('input',e=>{beta=e.target.value/100;document.getElementById('vB').textContent=e.target.value+'%'});
document.getElementById('rV').addEventListener('input',e=>{vacc=e.target.value/100;document.getElementById('vV').textContent=e.target.value+'%';user=false;reset();infect(P.filter(p=>p.s===0)[0]);if(reduce)runOut()});
document.getElementById('again').addEventListener('click',()=>{user=false;town();infect(P.filter(p=>p.s===0)[0]);if(reduce)runOut()});
</script>
</body>
</html>
