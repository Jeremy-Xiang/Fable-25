<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATRIX — the same data, until you sort it</title>
<meta name="description" content="An adjacency matrix of a 36-person network. In alphabetical order it is noise; reorder the rows by community and four bright blocks appear. Nothing about the data changes — only the order.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1014'/%3E%3Crect x='4' y='4' width='11' height='11' fill='%23ff4d6d'/%3E%3Crect x='17' y='17' width='11' height='11' fill='%234cc9f0'/%3E%3Crect x='19' y='6' width='3' height='3' fill='%23777'/%3E%3Crect x='7' y='22' width='3' height='3' fill='%23777'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#f0f1f5;--dim:#878b99;--line:rgba(240,241,245,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1014;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;height:100vh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
::selection{background:#ff4d6d;color:#111}
a:focus-visible,button:focus-visible{outline:2px solid #4cc9f0;outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.6rem}
.mark{font-family:'Anton',sans-serif;font-size:1.4rem;letter-spacing:.12em}
nav{display:flex;gap:1.4rem}
nav a{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:#4cc9f0}
main{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:1.6rem;min-height:0;padding:0 1.6rem;align-items:center}
h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(2rem,4.6vw,3.6rem);line-height:.98;text-transform:uppercase}
h1 em{font-style:normal;color:#ff4d6d}
.lede{font-size:.92rem;line-height:1.6;color:#b9bcc8;margin:1rem 0 1.3rem}
.deck{display:flex;flex-direction:column;gap:.4rem}
.deck button{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;text-align:left;background:none;border:1px solid var(--line);color:var(--ink);padding:.7rem .9rem;cursor:pointer;display:flex;justify-content:space-between}
.deck button:hover{border-color:var(--ink)}
.deck button[aria-pressed=true]{background:var(--ink);color:#0f1014;border-color:var(--ink)}
.deck button span{opacity:.6}
.read{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--dim);margin-top:1.1rem;min-height:2.6em;line-height:1.6}
.read b{color:var(--ink);font-weight:400}
.wrap{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#c{display:block}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem;padding:.8rem 1.6rem 1.1rem;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
footer a{color:#4cc9f0}
@media(max-width:820px){body{height:auto;min-height:100vh;overflow:auto}main{grid-template-columns:1fr}.wrap{height:96vw}}
</style>
</head>
<body>
<header><span class="mark">MATRIX</span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<main>
  <section><h1>The same data, until you <em>sort it.</em></h1>
    <p class="lede">Thirty-six people. A lit square means the row person knows the column person. Change only the order of the rows and columns.</p>
    <div class="deck" id="deck"><button data-o="name" aria-pressed="true">alphabetical <span>noise</span></button><button data-o="group" aria-pressed="false">by community <span>blocks</span></button><button data-o="degree" aria-pressed="false">by popularity <span>a corner</span></button><button data-o="shuffle" aria-pressed="false">shuffle <span>chaos</span></button></div>
    <div class="read" id="read">hover a square to see who it joins</div></section>
  <div class="wrap"><canvas id="c" aria-label="Adjacency matrix of a 36-person network"></canvas></div>
</main>
<footer><span>invented network · site 138 / fable 25 · built by claude (fable 5)</span><span><a href="guide/">how it was made</a></span></footer>
<script>
const NAMES='Abel Bea Cato Dita Eli Fenn Gus Hana Ivo Jun Kit Lena Milo Nia Otto Pia Quin Rae Sol Tess Ugo Vera Wim Xia Yara Zeb Ada Bo Cy Dee Ed Flo Gil Hal Ida Jo'.split(' ');
const COL=['#ff4d6d','#4cc9f0','#ffd60a','#80ed99'],N=36;
let seed=5;const rnd=()=>(seed=(seed*48271)%2147483647)/2147483647;
// communities are assigned out of alphabetical order on purpose
const grp=Array.from({length:N},(_, i)=>(i*7+3)%4),A=Array.from({length:N},()=>new Uint8Array(N)),deg=new Uint16Array(N);
for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)if(rnd()<(grp[i]===grp[j]?.74:.045)){A[i][j]=A[j][i]=1;deg[i]++;deg[j]++}
const cv=document.getElementById('c'),x=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let S,cell,pad,pos=new Float32Array(N),tgt=new Float32Array(N),hr=-1,hc=-1;
function order(k){let idx=[...Array(N).keys()];
  if(k==='name')idx.sort((a,b)=>NAMES[a].localeCompare(NAMES[b]));
  else if(k==='group')idx.sort((a,b)=>grp[a]-grp[b]||deg[b]-deg[a]);
  else if(k==='degree')idx.sort((a,b)=>deg[b]-deg[a]);
  else idx.sort(()=>Math.random()-.5);
  idx.forEach((id,p)=>tgt[id]=p)}
function resize(){const w=cv.parentElement,side=Math.min(w.clientWidth,w.clientHeight)-6,D=Math.min(devicePixelRatio||1,2);S=side;pad=54;cell=(S-pad)/N;cv.width=S*D;cv.height=S*D;cv.style.width=S+'px';cv.style.height=S+'px';x.setTransform(D,0,0,D,0,0)}
function draw(){x.fillStyle='#0f1014';x.fillRect(0,0,S,S);
  for(let i=0;i<N;i++){const py=pad+pos[i]*cell;
    for(let j=0;j<N;j++){const px=pad+pos[j]*cell,on=A[i][j],hl=i===hr||j===hc;
      if(on){x.fillStyle=grp[i]===grp[j]?COL[grp[i]]:'#9a9eab';x.globalAlpha=hr<0||hl?1:.35;x.fillRect(px+.6,py+.6,cell-1.2,cell-1.2)}
      else if(i===j){x.fillStyle='rgba(240,241,245,.12)';x.fillRect(px+.6,py+.6,cell-1.2,cell-1.2)}
      else if(hl){x.globalAlpha=1;x.fillStyle='rgba(240,241,245,.06)';x.fillRect(px,py,cell,cell)}}
    x.globalAlpha=1}
  x.font=Math.min(11,cell*.72)+'px "IBM Plex Mono",monospace';x.textBaseline='middle';
  for(let i=0;i<N;i++){x.fillStyle=i===hr||i===hc?'#fff':COL[grp[i]];x.globalAlpha=i===hr||i===hc?1:.8;x.textAlign='right';x.fillText(NAMES[i],pad-6,pad+pos[i]*cell+cell/2);
    x.save();x.translate(pad+pos[i]*cell+cell/2,pad-6);x.rotate(-Math.PI/2);x.textAlign='left';x.fillText(NAMES[i],0,0);x.restore()}
  x.globalAlpha=1}
function frame(){let moving=false;for(let i=0;i<N;i++){const d=tgt[i]-pos[i];if(Math.abs(d)>.01){pos[i]+=d*.1;moving=true}else pos[i]=tgt[i]}draw();if(moving)requestAnimationFrame(frame)}
order('name');pos.set(tgt);addEventListener('resize',()=>{resize();draw()});resize();draw();
document.getElementById('deck').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#deck button').forEach(q=>q.setAttribute('aria-pressed',q===b));order(b.dataset.o);if(reduce){pos.set(tgt);draw()}else requestAnimationFrame(frame)});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left-pad,my=e.clientY-r.top-pad,pc=Math.floor(mx/cell),prow=Math.floor(my/cell);hr=hc=-1;
  for(let i=0;i<N;i++){if(Math.round(pos[i])===prow)hr=i;if(Math.round(pos[i])===pc)hc=i}
  document.getElementById('read').innerHTML=hr>=0&&hc>=0?'<b>'+NAMES[hr]+'</b> and <b>'+NAMES[hc]+'</b> '+(hr===hc?'are the same person':A[hr][hc]?'know each other'+(grp[hr]===grp[hc]?' · same community':' · a bridge between communities'):'have never met'):'hover a square to see who it joins';draw()});
cv.addEventListener('pointerleave',()=>{hr=hc=-1;draw()});
</script>
</body>
</html>
