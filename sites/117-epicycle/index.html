<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPICYCLE — any drawing is just circles on circles</title>
<meta name="description" content="Draw one closed line. A Fourier transform breaks it into spinning circles riding on circles, and the machine redraws your line from nothing but rotation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111016'/%3E%3Ccircle cx='13' cy='17' r='9' fill='none' stroke='%23f4efe4' stroke-width='1.3'/%3E%3Ccircle cx='22' cy='17' r='4' fill='none' stroke='%23ff5d8f' stroke-width='1.3'/%3E%3Ccircle cx='26' cy='17' r='1.6' fill='%23ff5d8f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe4;--dim:#8f8a99;--pink:#ff5d8f;--line:rgba(244,239,228,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111016;color:var(--ink);font-family:'DM Mono',monospace;height:100vh;overflow:hidden}
::selection{background:var(--pink);color:#111}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;pointer-events:none}
header *{pointer-events:auto}
.mark{font-family:'Instrument Serif',serif;font-size:1.5rem}
.mark em{color:var(--pink)}
nav{display:flex;gap:1.4rem}
nav a{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:var(--pink)}
.plate{position:fixed;left:1.5rem;bottom:1.3rem;z-index:5;pointer-events:none;max-width:22rem}
.plate h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(1.5rem,3.4vw,2.5rem);line-height:1.05}
.plate h1 em{color:var(--pink)}
.plate p{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:.6rem;line-height:1.8}
.deck{position:fixed;right:1.5rem;bottom:1.3rem;z-index:5;display:flex;flex-direction:column;gap:.6rem;align-items:flex-end;background:rgba(17,16,22,.8);padding:.8rem 1rem;border:1px solid var(--line);border-radius:10px}
.deck label{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;gap:.8rem;align-items:center}
.deck b{color:var(--pink);font-weight:500;min-width:2.2em;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--pink)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--pink)}
.deck .row{display:flex;gap:.4rem}
.deck button{font:inherit;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.45rem .8rem;cursor:pointer}
.deck button:hover{border-color:var(--pink);color:var(--pink)}
</style>
</head>
<body>
<canvas id="c" aria-label="Fourier epicycles drawing a shape; drag to draw your own closed line"></canvas>
<header><span class="mark">Epi<em>cycle</em></span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<div class="plate"><h1>Any drawing is just<br><em>circles on circles.</em></h1><p>drag anywhere to draw one line<br>fourier does the rest</p></div>
<div class="deck"><label>circles <input type="range" id="rN" min="1" max="120" value="60" aria-label="Number of circles"><b id="vN">60</b></label><div class="row"><button data-s="heart">heart</button><button data-s="star">star</button><button data-s="clef">squiggle</button></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,D,coef=[],N=0,keep=60,t=0,trail=[],drawing=null;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}
const SHAPES={
  heart:a=>[16*Math.sin(a)**3,-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))],
  star:a=>{const r=11+6*Math.cos(5*a);return[r*Math.sin(a),-r*Math.cos(a)]},
  clef:a=>[10*Math.sin(a)+6*Math.sin(3*a+.6)+3*Math.cos(7*a),10*Math.cos(2*a)+5*Math.sin(5*a)-2*Math.cos(9*a)]};
function load(name){const pts=[];for(let i=0;i<256;i++)pts.push(SHAPES[name](i/256*Math.PI*2));const s=Math.min(W,H)/52;analyse(pts.map(p=>[p[0]*s,p[1]*s]))}
// resample a hand-drawn path to n evenly spaced points, closed
function resample(p,n){const L=[0];for(let i=1;i<=p.length;i++){const a=p[i-1],b=p[i%p.length];L.push(L[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
  const out=[];let j=0;for(let i=0;i<n;i++){const d=i/n*L[p.length];while(L[j+1]<d)j++;const a=p[j],b=p[(j+1)%p.length],k=(d-L[j])/((L[j+1]-L[j])||1);out.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k])}return out}
function analyse(pts){N=pts.length;coef=[];
  for(let k=0;k<N;k++){let re=0,im=0;for(let n=0;n<N;n++){const a=-2*Math.PI*k*n/N;re+=pts[n][0]*Math.cos(a)-pts[n][1]*Math.sin(a);im+=pts[n][0]*Math.sin(a)+pts[n][1]*Math.cos(a)}
    re/=N;im/=N;coef.push({f:k>N/2?k-N:k,amp:Math.hypot(re,im),ph:Math.atan2(im,re)})}
  coef.sort((a,b)=>b.amp-a.amp);t=0;trail=[]}
function tip(tt,show){let px=W*.5,py=H*.47;
  for(let i=0;i<Math.min(keep+1,coef.length);i++){const c=coef[i],ox=px,oy=py;px+=c.amp*Math.cos(c.f*tt+c.ph);py+=c.amp*Math.sin(c.f*tt+c.ph);
    if(show&&i>0&&c.amp>.4){x.strokeStyle='rgba(244,239,228,.16)';x.lineWidth=1;x.beginPath();x.arc(ox,oy,c.amp,0,7);x.stroke();x.strokeStyle='rgba(244,239,228,.5)';x.beginPath();x.moveTo(ox,oy);x.lineTo(px,py);x.stroke()}}
  return[px,py]}
function frame(){requestAnimationFrame(frame);x.clearRect(0,0,W,H);
  if(drawing){x.strokeStyle='#ff5d8f';x.lineWidth=2;x.beginPath();drawing.forEach((p,i)=>i?x.lineTo(p[0]+W*.5,p[1]+H*.47):x.moveTo(p[0]+W*.5,p[1]+H*.47));x.stroke();return}
  if(!N)return;
  if(reduce){trail=[];for(let i=0;i<=N;i++)trail.push(tip(i/N*Math.PI*2,false))}
  const p=tip(t,!reduce);if(!reduce){trail.push(p);if(trail.length>N*2)trail.shift();t+=Math.PI*2/N/2;if(t>Math.PI*2)t-=Math.PI*2}
  x.lineWidth=2.4;x.lineJoin='round';
  for(let i=1;i<trail.length;i++){x.strokeStyle=`rgba(255,93,143,${reduce?1:(i/trail.length)**.6})`;x.beginPath();x.moveTo(trail[i-1][0],trail[i-1][1]);x.lineTo(trail[i][0],trail[i][1]);x.stroke()}
  x.fillStyle='#fff';x.beginPath();x.arc(p[0],p[1],3.4,0,7);x.fill()}
addEventListener('resize',()=>{resize()});resize();load('heart');
// warm the trail so the first frame already shows most of the shape
if(!reduce)for(let i=0;i<N*1.6;i++){trail.push(tip(t,false));t+=Math.PI*2/N/2}
requestAnimationFrame(frame);
cv.addEventListener('pointerdown',e=>{drawing=[[e.clientX-W*.5,e.clientY-H*.47]];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drawing)drawing.push([e.clientX-W*.5,e.clientY-H*.47])});
cv.addEventListener('pointerup',()=>{if(drawing&&drawing.length>8)analyse(resample(drawing,256));drawing=null});
document.getElementById('rN').addEventListener('input',e=>{keep=+e.target.value;document.getElementById('vN').textContent=keep;trail=[]});
document.querySelectorAll('.deck button').forEach(b=>b.addEventListener('click',()=>load(b.dataset.s)));
</script>
</body>
</html>
