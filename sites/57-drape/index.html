<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23b08968%22/></svg>">
<title>DRAPE — hand-rolled cloth, mass-spring-damper</title>
<meta name="description" content="DRAPE is a hand-rolled mass-spring-damper cloth simulation — no physics library — draping over an implied form under gravity, with the cursor acting as wind.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400;0,600;1,400&family=Fragment+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#efe7dc; --bg1:#e2d6c4;
    --cloth1:#c9b8a0; --cloth2:#7d6b56;
    --thread:#a63d2f;
    --ink:#2c241a; --dim:#6e6252;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 20%, var(--bg0), var(--bg1) 80%);
    color:var(--ink);font-family:'Fragment Mono',monospace;
    display:flex;flex-direction:column;min-height:100%;overflow-x:hidden;
  }
  ::selection{background:var(--thread);color:#fff}

  header{display:flex;justify-content:space-between;align-items:center;padding:1.3rem 2rem;position:relative;z-index:3}
  .m{font-family:'Vollkorn',serif;font-weight:600;font-size:1.15rem;letter-spacing:.03em;color:var(--ink)}
  nav{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase}
  nav a{color:var(--ink);text-decoration:none;opacity:.65;margin-left:1.5rem}
  nav a:hover{opacity:1;color:var(--thread)}

  .hero{text-align:center;padding:.3rem 1.5rem 0;position:relative;z-index:2}
  .hero h1{font-family:'Vollkorn',serif;font-weight:600;font-style:italic;font-size:clamp(1.7rem,5vw,3rem);
    color:var(--ink);letter-spacing:.01em}
  .hero p{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:.7rem}

  .stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:1.2rem 1rem;position:relative}
  .stage{position:relative;width:min(720px,94vw);aspect-ratio:9/10;
    border-radius:6px;overflow:hidden;
    box-shadow:0 24px 60px rgba(60,45,25,.18), inset 0 0 0 1px rgba(60,45,25,.12);
    background:linear-gradient(180deg,#f4ede0,#e6dac6 60%,#dcccb2)}
  canvas#cloth{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

  .rod{position:absolute;top:6%;left:8%;right:8%;height:8px;border-radius:4px;
    background:linear-gradient(180deg,#8b7355,#5c4a34);box-shadow:0 3px 6px rgba(0,0,0,.25);z-index:4;pointer-events:none}

  .panel{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:1.3rem;align-items:center;
    justify-content:center;padding:0 1.5rem 1.8rem;text-align:center}
  .grp{display:flex;flex-direction:column;align-items:center;gap:.4rem}
  .grp .lab{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .btnrow{display:flex;gap:.6rem}
  button.act{font-family:'Fragment Mono',monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
    background:none;border:1px solid rgba(44,36,26,.3);color:var(--ink);padding:.5rem .95rem;
    border-radius:99px;cursor:pointer;transition:.2s}
  button.act:hover{border-color:var(--thread);color:var(--thread)}
  input[type=range]{-webkit-appearance:none;width:120px;background:transparent;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(44,36,26,.3)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--thread);margin-top:-5.5px}

  footer{position:relative;z-index:3;text-align:center;font-size:.58rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);padding:0 1.5rem 1.3rem}
  footer a{color:var(--thread)}

  @media(max-width:640px){
    header{padding:1rem 1.2rem}
    .panel{gap:.9rem}
  }
  @media(prefers-reduced-motion:reduce){
    button.act{transition:none}
  }
</style>
</head>
<body>

<header>
  <span class="m"><em>Drape</em></span>
  <nav><a href="guide/">Guide</a><a href="../">Index</a></nav>
</header>

<div class="hero">
  <h1>Cloth that answers to gravity.</h1>
  <p>hand-rolled mass-spring-damper mesh — no physics library</p>
</div>

<div class="stage-wrap">
  <div class="stage">
    <div class="rod" aria-hidden="true"></div>
    <canvas id="cloth" role="img" aria-label="A simulated swath of cloth pinned to a rod, draping over a rounded form under gravity; move the pointer across it to blow it like wind"></canvas>
  </div>
</div>

<div class="panel">
  <div class="grp">
    <span class="lab">Wind strength</span>
    <input type="range" id="wind" min="0" max="100" value="35">
  </div>
  <div class="grp">
    <span class="lab">Stiffness</span>
    <input type="range" id="stiff" min="10" max="95" value="38">
  </div>
  <div class="grp">
    <span class="lab">Actions</span>
    <div class="btnrow">
      <button class="act" id="gustBtn">Gust</button>
      <button class="act" id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<footer>
  DRAPE — MASS-SPRING-DAMPER CLOTH SIM · SITE 57 OF 62 · BUILT BY CLAUDE (FABLE 25 · WAVE 3) · <a href="guide/">/GUIDE</a> · <a href="../">/INDEX</a>
</footer>

<script>
/* ============================================================
   Hand-rolled mass-spring-damper cloth — no physics library.
   Grid of point masses connected by structural, shear and bend
   springs (Hooke's law + linear damping), integrated with
   semi-implicit Euler, pinned top row, gravity, cursor wind,
   and a collision sphere standing in for "an implied form".
   ============================================================ */
const canvas = document.getElementById('cloth');
const ctx = canvas.getContext('2d');
const stage = document.querySelector('.stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let DPR = Math.min(devicePixelRatio||1, 2);
let W=0, H=0;
function resize(){
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

// --- grid setup ---
const COLS = 26, ROWS = 24;
let pts = [], springs = [];
const GRAVITY = 620;      // px/s^2
let STIFF = 0.38;         // 0..1 UI-facing, mapped to spring K
let WINDMAG = 0.35;

function buildCloth(){
  pts = [];
  const marginX = 0.10, top = 0.09, spanX = 1-marginX*2, spanY = 0.82;
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      let px = (marginX + spanX*x/(COLS-1)) * W;
      let py = (top + spanY*y/(ROWS-1)) * H;
      const pinned = y===0;
      if(!pinned){
        // tiny asymmetric jitter — breaks perfect symmetry so folds buckle
        // naturally under gravity instead of draping into a smooth, flat cone
        px += (Math.sin(x*12.9+y*4.1)*0.5) * (W*0.0028);
        py += (Math.cos(y*7.3+x*2.7)*0.5) * (H*0.0018);
      }
      pts.push({ x:px, y:py, ox:px, oy:py, pinned, gx:x, gy:y });
    }
  }
  springs = [];
  const idx=(x,y)=>y*COLS+x;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(x<COLS-1) springs.push({a:idx(x,y), b:idx(x+1,y), type:'struct'});
    if(y<ROWS-1) springs.push({a:idx(x,y), b:idx(x,y+1), type:'struct'});
    if(x<COLS-1 && y<ROWS-1){
      springs.push({a:idx(x,y), b:idx(x+1,y+1), type:'shear'});
      springs.push({a:idx(x+1,y), b:idx(x,y+1), type:'shear'});
    }
    if(x<COLS-2) springs.push({a:idx(x,y), b:idx(x+2,y), type:'bend'});
    if(y<ROWS-2) springs.push({a:idx(x,y), b:idx(x,y+2), type:'bend'});
  }
  springs.forEach(s=>{
    const A=pts[s.a], B=pts[s.b];
    s.rest = Math.hypot(A.x-B.x, A.y-B.y);
  });
}

// implied form: a collision sphere the cloth drapes over
function form(){
  return { x: W*0.5, y: H*0.46, r: Math.min(W,H)*0.22 };
}

let vel = []; // per-point velocity {vx,vy}
function resetSim(){
  buildCloth();
  vel = pts.map(()=>({vx:0,vy:0}));
  // pre-roll: settle the mesh into a natural resting drape before first paint,
  // so the piece never opens on a flat, un-draped sheet
  for(let i=0;i<420;i++) step(1/60, true);
}

let mouse = { x:-9999, y:-9999, px:-9999, py:-9999, down:false };
let gust = 0;

function step(dt){
  if(dt<=0) return;
  const K_STRUCT = 0.55*STIFF, K_SHEAR = 0.32*STIFF, K_BEND = 0.3*STIFF;
  const DAMP = 5.2;
  const f = form();

  // mouse velocity -> local wind impulse direction
  const mvx = mouse.x-mouse.px, mvy = mouse.y-mouse.py;
  const mouseSpeed = Math.hypot(mvx,mvy);

  const acc = pts.map(()=>({ax:0, ay:GRAVITY}));

  // ambient wind: gentle horizontal drift + gust bursts
  const ambient = Math.sin(performance.now()/1400)*14*WINDMAG;
  for(let i=0;i<pts.length;i++){
    acc[i].ax += ambient + gust;
  }

  // spring forces (Hooke's law + damping along the spring axis)
  for(const s of springs){
    const A=pts[s.a], B=pts[s.b];
    const dx=B.x-A.x, dy=B.y-A.y;
    const dist=Math.hypot(dx,dy)||0.0001;
    const nx=dx/dist, ny=dy/dist;
    const stretch = dist - s.rest;
    const k = s.type==='struct'?K_STRUCT:(s.type==='shear'?K_SHEAR:K_BEND);
    const relVx = vel[s.b].vx-vel[s.a].vx, relVy = vel[s.b].vy-vel[s.a].vy;
    const relVAlong = relVx*nx+relVy*ny;
    const forceMag = k*140*stretch + DAMP*relVAlong;
    const fx = nx*forceMag, fy = ny*forceMag;
    if(!A.pinned){ acc[s.a].ax += fx/1; acc[s.a].ay += fy/1; }
    if(!B.pinned){ acc[s.b].ax -= fx/1; acc[s.b].ay -= fy/1; }
  }

  // cursor wind: push points near the pointer along its motion
  if(mouseSpeed>0.1){
    for(let i=0;i<pts.length;i++){
      const p = pts[i];
      const d = Math.hypot(p.x-mouse.x, p.y-mouse.y);
      const radius = Math.min(W,H)*0.26;
      if(d<radius){
        const falloff = 1-d/radius;
        acc[i].ax += mvx*falloff*7;
        acc[i].ay += mvy*falloff*7;
      }
    }
  }

  // integrate (semi-implicit Euler)
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    if(p.pinned) continue;
    vel[i].vx = (vel[i].vx + acc[i].ax*dt) * 0.985;
    vel[i].vy = (vel[i].vy + acc[i].ay*dt) * 0.985;
    p.x += vel[i].vx*dt;
    p.y += vel[i].vy*dt;

    // collision against implied form (sphere) — push points to its surface
    const dx=p.x-f.x, dy=p.y-f.y;
    const dist=Math.hypot(dx,dy)||0.0001;
    if(dist < f.r){
      const nx=dx/dist, ny=dy/dist;
      p.x = f.x + nx*f.r;
      p.y = f.y + ny*f.r;
      vel[i].vx *= 0.4; vel[i].vy *= 0.4;
    }
    // floor of stage
    if(p.y > H*0.97){ p.y = H*0.97; vel[i].vy *= -0.15; }
    if(p.x < 2){ p.x=2; vel[i].vx*=-0.2; }
    if(p.x > W-2){ p.x=W-2; vel[i].vx*=-0.2; }
  }

  gust *= 0.92;
  mouse.px = mouse.x; mouse.py = mouse.y;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const idx=(x,y)=>y*COLS+x;
  const light = { x: W*0.32, y: -H*0.3 }; // fake light direction source (upper-left)

  for(let y=0;y<ROWS-1;y++){
    for(let x=0;x<COLS-1;x++){
      const p00=pts[idx(x,y)], p10=pts[idx(x+1,y)], p01=pts[idx(x,y+1)], p11=pts[idx(x+1,y+1)];
      // triangle 1
      drawTri(p00,p10,p01,light);
      // triangle 2
      drawTri(p10,p11,p01,light);
    }
  }
  // accent thread: trace the hem (bottom row) as a stitched line
  ctx.beginPath();
  for(let x=0;x<COLS;x++){
    const p = pts[idx(x,ROWS-1)];
    if(x===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle = 'rgba(166,61,47,.55)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([3,4]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawTri(a,b,c,light){
  // Shading proxy: compare each triangle's CURRENT screen-space area against its
  // REST (flat, unfolded) area. Where the mesh has folded/bunched under gravity,
  // the projected area compresses relative to rest -> shadow; where it's taut or
  // catching the fold's outer curve, area holds or grows -> lit. This is a real
  // consequence of the simulated geometry, not a hand-picked highlight.
  const ux=b.x-a.x, uy=b.y-a.y, vx=c.x-a.x, vy=c.y-a.y;
  const area = Math.abs(ux*vy-uy*vx)*0.5;
  const rux=b.ox-a.ox, ruy=b.oy-a.oy, rvx=c.ox-a.ox, rvy=c.oy-a.oy;
  const restArea = Math.abs(rux*rvy-ruy*rvx)*0.5;
  if(restArea<0.001) return;
  const ratio = Math.min(1.7, Math.max(0.3, area/restArea));

  const cxp=(a.x+b.x+c.x)/3, cyp=(a.y+b.y+c.y)/3;
  const lx=light.x-cxp, ly=light.y-cyp;
  const llen=Math.hypot(lx,ly)||1;
  const cross = ux*vy-uy*vx;
  const dirLight = cross!==0 ? Math.sign(cross)*(lx/llen) : 0;
  const ambient = 1 - (cyp/H)*0.22;

  let shade = (ratio-0.3)/1.4;             // 0..1 from fold compression
  shade = shade*0.62 + ambient*0.26 + dirLight*0.14;
  const t = Math.min(0.94, Math.max(0.10, shade));
  const col = lerpColor(cloth2rgb, cloth1rgb, t);
  ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
  ctx.beginPath();
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y);
  ctx.closePath();
  ctx.fill();
}
const cloth1rgb=[214,197,169], cloth2rgb=[74,61,46];
function lerpColor(c0,c1,t){ return [0,1,2].map(i=>Math.round(c0[i]+(c1[i]-c0[i])*t)); }

// --- interaction ---
canvas.addEventListener('pointermove', e=>{
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX-r.left; mouse.y = e.clientY-r.top;
});
canvas.addEventListener('pointerleave', ()=>{ mouse.x=-9999; mouse.y=-9999; mouse.px=-9999; mouse.py=-9999; });
canvas.addEventListener('pointerdown', e=>{
  const r = canvas.getBoundingClientRect();
  mouse.x = mouse.px = e.clientX-r.left;
  mouse.y = mouse.py = e.clientY-r.top;
  gust += 60;
});

document.getElementById('wind').addEventListener('input', e=>{ WINDMAG = e.target.value/100; });
document.getElementById('stiff').addEventListener('input', e=>{ STIFF = e.target.value/100; });
document.getElementById('gustBtn').addEventListener('click', ()=>{ gust += 220; });
document.getElementById('resetBtn').addEventListener('click', resetSim);

addEventListener('resize', ()=>{ resize(); resetSim(); });
resize(); resetSim();

let last = performance.now();
function loop(now){
  const dt = Math.min(0.032, (now-last)/1000); last = now;
  if(!reduceMotion){
    // sub-step for stability
    step(dt/2); step(dt/2);
  } else {
    // reduced motion: settle once to a resting drape, then stop animating
    if(!loop.settled){ for(let i=0;i<220;i++) step(1/60); loop.settled = true; }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
