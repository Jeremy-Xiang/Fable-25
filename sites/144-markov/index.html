<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARKOV — a sentence machine you can see inside</title>
<meta name="description" content="A Markov chain drawn as a graph: every word is a node, every arrow is 'this word was followed by that one'. A token hops along the arrows and writes new sentences from an old paragraph. Edit the text and the machine rewires.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f7f4ee'/%3E%3Cpath d='M9 11 Q16 4 23 11 M23 14 Q23 23 16 24 M13 23 Q8 20 8 14' fill='none' stroke='%23222' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='12' r='3' fill='%23222'/%3E%3Ccircle cx='24' cy='12' r='3' fill='%23e63946'/%3E%3Ccircle cx='15' cy='24' r='3' fill='%23222'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ee;--ink:#1e1c19;--dim:#8d887e;--red:#e63946;--line:rgba(30,28,25,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Literata',serif;height:100vh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
::selection{background:var(--red);color:#fff}
a:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.6rem}
.mark{font-weight:600;font-size:1.3rem}
.mark em{color:var(--red)}
nav{display:flex;gap:1.4rem}
nav a{font-family:'Azeret Mono',monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:var(--red)}
main{display:grid;grid-template-columns:minmax(0,350px) 1fr;min-height:0}
aside{padding:.4rem 1.6rem 1rem;display:flex;flex-direction:column;gap:.9rem;min-height:0}
h1{font-weight:400;font-size:clamp(1.7rem,3.2vw,2.5rem);line-height:1.06}
h1 em{color:var(--red)}
.k{font-family:'Azeret Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
textarea{flex:1;min-height:90px;font-family:'Literata',serif;font-size:.86rem;line-height:1.55;padding:.8rem;border:1px solid var(--ink);background:#fffdf8;color:var(--ink);resize:none}
.out{flex:1.1;min-height:90px;font-size:1.05rem;line-height:1.5;font-style:italic;overflow:hidden;border-top:1px solid var(--line);padding-top:.7rem;display:flex;flex-direction:column;justify-content:flex-end}
.out p{margin-top:.4rem;opacity:.45}.out p:last-child{opacity:1}
.out b{color:var(--red);font-weight:400}
.wrap{min-height:0;min-width:0}
#c{width:100%;height:100%;display:block}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem;padding:.7rem 1.6rem 1.1rem;font-family:'Azeret Mono',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
footer a{color:var(--red)}
@media(max-width:820px){body{height:auto;min-height:100vh;overflow:auto}main{grid-template-columns:1fr}.wrap{height:96vw}}
</style>
</head>
<body>
<header><span class="mark">Mar<em>kov</em></span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<main>
  <aside>
    <h1>A sentence machine you can <em>see inside.</em></h1>
    <span class="k">what it has read — edit me</span>
    <textarea id="t" spellcheck="false" aria-label="Source text for the chain"></textarea>
    <span class="k">what it writes</span>
    <div class="out" id="out" aria-live="off"></div>
  </aside>
  <div class="wrap"><canvas id="c" aria-label="Graph of which word follows which"></canvas></div>
</main>
<footer><span><span id="nw">0</span> words · <span id="ne">0</span> arrows · it only knows which word came next</span><span>site 144 / fable 25 · built by claude (fable 5) · <a href="guide/">how it was made</a></span></footer>
<script>
const TEXT='the river carries the boat. the boat follows the river to the sea. the sea remembers the rain. the rain becomes the river. the moon pulls the sea. the boat dreams of the moon. the night carries the moon over the river. the rain follows the night to the sea. the sea dreams of the rain.';
const cv=document.getElementById('c'),x=cv.getContext('2d'),ta=document.getElementById('t'),out=document.getElementById('out');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,D,nodes=[],map={},edges=[],at=null,prev=null,hop=1,line=[],lines=[],heat=new Map();
function build(){const toks=ta.value.toLowerCase().replace(/[^a-z'.!?\s-]/g,' ').replace(/[.!?]+/g,' . ').split(/\s+/).filter(Boolean);map={};nodes=[];edges=[];
  const N=w=>map[w]||(nodes.push(map[w]={w,out:[],n:0,tot:0}),map[w]);
  for(let i=0;i<toks.length;i++){const a=N(toks[i]);a.n++;const nx=toks[(i+1)%toks.length];if(i<toks.length-1||true){const b=N(nx);let e=a.out.find(q=>q.b===b);if(!e){e={a,b,c:0};a.out.push(e);edges.push(e)}e.c++;a.tot++}}
  nodes=nodes.slice(0,60);layout();at=map['.']||nodes[0];prev=null;hop=1;line=[];
  document.getElementById('nw').textContent=nodes.length;document.getElementById('ne').textContent=edges.length}
function layout(){// most-used words in the middle, the rest on rings around them
  const s=[...nodes].sort((a,b)=>b.n-a.n),R=Math.min(W,H)/2-56;s.forEach((n,i)=>{if(i===0){n.x=W/2;n.y=H/2;return}const ring=i<7?1:2,cnt=ring===1?Math.min(6,s.length-1):s.length-7,k=ring===1?i-1:i-7,a=k/cnt*Math.PI*2+(ring===2?.3:-.9),r=ring===1?R*.46:R*(s.length>7?1:.46);n.x=W/2+Math.cos(a)*r;n.y=H/2+Math.sin(a)*r*.92})}
function resize(){D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);layout()}
function ctrl(e){const mx=(e.a.x+e.b.x)/2,my=(e.a.y+e.b.y)/2,dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,L=Math.hypot(dx,dy)||1;return[mx-dy/L*L*.18,my+dx/L*L*.18]}
const bez=(e,t)=>{const[cx,cy]=ctrl(e);return[(1-t)**2*e.a.x+2*(1-t)*t*cx+t*t*e.b.x,(1-t)**2*e.a.y+2*(1-t)*t*cy+t*t*e.b.y]};
function step(){// pick the next word in proportion to how often it followed this one
  let r=Math.random()*at.tot,e=at.out[0];for(const q of at.out){r-=q.c;if(r<=0){e=q;break}}prev=e;hop=0;heat.set(e,1);at=e.b;
  if(at.w==='.'){if(line.length){lines.push(line.join(' ')+'.');if(lines.length>4)lines.shift()}line=[]}else line.push(at.w);
  out.innerHTML=lines.map(l=>'<p>'+l[0].toUpperCase()+l.slice(1)+'</p>').join('')+'<p>'+(line.length?line.slice(0,-1).join(' ')+' <b>'+line[line.length-1]+'</b>':'&nbsp;')+'</p>'}
function draw(){x.clearRect(0,0,W,H);
  for(const e of edges){if(e.a===e.b)continue;const h=heat.get(e)||0,[cx,cy]=ctrl(e);x.strokeStyle=h>.02?`rgba(230,57,70,${.25+h*.75})`:'rgba(30,28,25,.2)';x.lineWidth=.6+Math.min(5,e.c*.8)+(h>.02?1:0);x.beginPath();x.moveTo(e.a.x,e.a.y);x.quadraticCurveTo(cx,cy,e.b.x,e.b.y);x.stroke();
    // arrowhead a little before the target
    const p=bez(e,.8),q=bez(e,.86),ang=Math.atan2(q[1]-p[1],q[0]-p[0]);x.fillStyle=x.strokeStyle;x.beginPath();x.moveTo(q[0]+Math.cos(ang)*6,q[1]+Math.sin(ang)*6);x.lineTo(q[0]+Math.cos(ang+2.5)*6,q[1]+Math.sin(ang+2.5)*6);x.lineTo(q[0]+Math.cos(ang-2.5)*6,q[1]+Math.sin(ang-2.5)*6);x.fill();if(h)heat.set(e,h*.97)}
  x.textAlign='center';x.textBaseline='middle';
  for(const n of nodes){const here=n===at,dot=n.w==='.',fs=Math.min(26,13+n.n*1.6);x.font=(here?'600 ':'400 ')+fs+'px Literata,serif';const w=dot?26:x.measureText(n.w).width+20;
    x.fillStyle=here?'#e63946':'#f7f4ee';x.strokeStyle=here?'#e63946':'#1e1c19';x.lineWidth=1.3;x.beginPath();x.roundRect(n.x-w/2,n.y-fs*.82,w,fs*1.64,fs);x.fill();x.stroke();x.fillStyle=here?'#fff':'#1e1c19';x.fillText(dot?'●':n.w,n.x,n.y+1)}
  if(prev&&hop<1){const p=bez(prev,hop);x.fillStyle='#e63946';x.beginPath();x.arc(p[0],p[1],6,0,7);x.fill()}}
function frame(){requestAnimationFrame(frame);hop+=.045;if(hop>=1.25)step();draw()}
ta.value=TEXT;addEventListener('resize',()=>{resize();draw()});resize();build();
for(let i=0;i<26;i++)step();if(reduce){for(let i=0;i<60;i++)step();hop=1;draw()}else requestAnimationFrame(frame);
ta.addEventListener('input',()=>{build();lines=[];if(reduce){for(let i=0;i<60&&nodes.length;i++)step();draw()}});
</script>
</body>
</html>
