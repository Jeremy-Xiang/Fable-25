<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POWERS OF TEN-ISH — scroll to fall forever inward</title>
<meta name="description" content="An infinite zoom: scroll and the scene dives through nested scales — galaxy to city to room to atom and back to galaxy, seamlessly looping. Scroll depth is the only control.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23090a12'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%237ba7ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%237ba7ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23ffd76a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,600;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#090a12; --ink:#e9ecf7; --dim:#7e849b; --dim2:#494e60; --blue:#7ba7ff; --gold:#ffd76a; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:'Spectral',serif; overflow-x:hidden}
::selection{background:var(--blue); color:#0a1533}
a:focus-visible{outline:2px solid var(--blue); outline-offset:3px}

#zoom{position:fixed; inset:0; width:100%; height:100%}
#track{height:1200vh}

header{position:fixed; top:0; left:0; right:0; z-index:5; display:flex; justify-content:space-between;
  padding:1.3rem 1.6rem; mix-blend-mode:difference}
.mark{font-family:'Space Mono',monospace; font-weight:700; font-size:.74rem; letter-spacing:.24em}
nav{display:flex; gap:1.5rem}
nav a{font-family:'Space Mono',monospace; font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); opacity:.7; text-decoration:none}
nav a:hover{opacity:1}

.plate{position:fixed; left:1.6rem; bottom:1.4rem; z-index:5; pointer-events:none}
.plate h1{font-weight:300; font-size:clamp(1.3rem,3vw,2rem); line-height:1.3}
.plate h1 em{font-style:italic; color:var(--blue)}
.plate p{font-family:'Space Mono',monospace; font-size:.58rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim2); margin-top:.6rem; line-height:1.9}

.scale{position:fixed; right:1.6rem; bottom:1.4rem; z-index:5; text-align:right; pointer-events:none;
  font-family:'Space Mono',monospace; font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); line-height:2}
.scale b{color:var(--gold); font-weight:400; font-size:.82rem}
@media(max-width:640px){.scale{display:none}}
</style>
</head>
<body>

<canvas id="zoom" aria-label="Infinite zoom through nested scales, driven by scroll"></canvas>
<div id="track" aria-hidden="true"></div>

<header>
  <span class="mark">POWERS OF TEN-ISH</span>
  <nav><a href="guide/">Guide</a><a href="../">Index</a></nav>
</header>

<div class="plate">
  <h1>Scroll to fall<br><em>forever inward.</em></h1>
  <p>four nested scales · seamless loop<br>galaxy → city → room → atom → galaxy</p>
</div>

<div class="scale" aria-hidden="true">
  current scale<br><b id="sName">the galaxy</b><br><span id="sMag">×1</span>
</div>

<script>
/* ═════ POWERS OF TEN-ISH — infinite nested zoom ═════
   Four scenes drawn at recursive scale. Scroll maps to continuous zoom Z;
   each scene renders at scale 10^(Z - i·STEP) and fades in/out around its
   band, so diving through one scene's center reveals the next. Z wraps,
   so the atom contains the galaxy: an endless loop. */

const cv = document.getElementById('zoom');
const x = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,CX,CY;
function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; CX=W/2; CY=H/2; }
addEventListener('resize', resize); resize();

/* deterministic pseudo-random */
const rnd = (i,s=1)=> {
  const v = Math.sin(i*127.1 + s*311.7)*43758.5453;
  return v - Math.floor(v);
};

/* — scenes: each draws itself centered, sized by px radius r — */
function galaxy(r, a){
  x.save(); x.translate(CX,CY); x.globalAlpha = a;
  x.rotate(-.35);
  for (let arm=0;arm<3;arm++){
    for (let i=0;i<220;i++){
      const t = i/220;
      const ang = arm*2.09 + t*4.4;
      const rad = t*r;
      const px = Math.cos(ang)*rad + (rnd(i,arm)-.5)*r*.09;
      const py = Math.sin(ang)*rad*.62 + (rnd(i,arm+9)-.5)*r*.09;
      x.fillStyle = `rgba(${180+rnd(i)*70},${190+rnd(i,2)*50},255,${.9-t*.55})`;
      const s = (1-t)*2.4*(r/420)+.4;
      x.fillRect(px-s/2, py-s/2, s, s);
    }
  }
  const g = x.createRadialGradient(0,0,0, 0,0,r*.3);
  g.addColorStop(0,'rgba(255,236,200,.95)');
  g.addColorStop(1,'transparent');
  x.fillStyle=g; x.beginPath(); x.arc(0,0,r*.3,0,7); x.fill();
  x.restore();
}
function city(r, a){
  x.save(); x.translate(CX,CY); x.globalAlpha = a;
  const n = 26;
  for (let i=0;i<n;i++){
    const bw = r*.11, gap = r*2.4/n;
    const bx = -r*1.2 + i*gap;
    const bh = (0.25 + rnd(i,7)*.75) * r * 1.05;
    x.fillStyle = '#0e1220';
    x.fillRect(bx, r*.55-bh, bw, bh);
    x.fillStyle = 'rgba(255,214,120,.8)';
    for (let wy=0; wy<bh-r*.05; wy+=r*.055)
      for (let wx=r*.014; wx<bw-r*.02; wx+=r*.03)
        if (rnd(i+wx*13+wy*7) > .45) x.fillRect(bx+wx, r*.55-bh+wy+r*.012, r*.012, r*.026);
  }
  // moon = the portal to the next scale
  x.fillStyle = '#e9ecf7';
  x.beginPath(); x.arc(0, -r*.62, r*.1, 0, 7); x.fill();
  x.restore();
}
function room(r, a){
  x.save(); x.translate(CX,CY); x.globalAlpha = a;
  // walls
  x.strokeStyle = 'rgba(233,236,247,.75)'; x.lineWidth = Math.max(1, r*.012);
  x.strokeRect(-r, -r*.7, r*2, r*1.4);
  // window with the city outside
  x.strokeRect(-r*.72, -r*.44, r*.6, r*.5);
  x.beginPath(); x.moveTo(-r*.42,-r*.44); x.lineTo(-r*.42,r*.06); x.stroke();
  // desk
  x.fillStyle = 'rgba(160,120,80,.85)';
  x.fillRect(-r*.1, r*.12, r*.86, r*.06);
  x.fillRect(-r*.04, r*.18, r*.06, r*.5);
  x.fillRect(r*.62, r*.18, r*.06, r*.5);
  // lamp + glow = the portal
  x.fillStyle = 'rgba(255,214,106,.92)';
  x.beginPath(); x.arc(r*.3, -r*.02, r*.062, 0, 7); x.fill();
  const g = x.createRadialGradient(r*.3,-r*.02,0, r*.3,-r*.02,r*.3);
  g.addColorStop(0,'rgba(255,214,106,.3)'); g.addColorStop(1,'transparent');
  x.fillStyle=g; x.beginPath(); x.arc(r*.3,-r*.02,r*.3,0,7); x.fill();
  x.restore();
}
function atom(r, a){
  x.save(); x.translate(CX,CY); x.globalAlpha = a;
  x.strokeStyle = 'rgba(123,167,255,.8)'; x.lineWidth = Math.max(1, r*.012);
  for (let o=0;o<3;o++){
    x.save(); x.rotate(o*1.05);
    x.beginPath(); x.ellipse(0,0, r, r*.38, 0, 0, 7); x.stroke();
    const t = performance.now()/900 + o*2.1;
    x.fillStyle = '#e9ecf7';
    x.beginPath(); x.arc(Math.cos(t)*r, Math.sin(t)*r*.38, Math.max(2,r*.03), 0, 7); x.fill();
    x.restore();
  }
  // nucleus = the next galaxy, glowing
  const ng = x.createRadialGradient(0,0,0, 0,0, r*.12);
  ng.addColorStop(0,'rgba(255,244,214,.95)');
  ng.addColorStop(.5,'rgba(255,215,106,.55)');
  ng.addColorStop(1,'transparent');
  x.fillStyle = ng;
  x.beginPath(); x.arc(0,0, r*.12, 0, 7); x.fill();
  x.restore();
}

const SCENES = [
  { draw: galaxy, name:'the galaxy' },
  { draw: city,   name:'the city'   },
  { draw: room,   name:'the room'   },
  { draw: atom,   name:'the atom'   },
];
const STEP = 1;            // decades between scenes
const BASE = 180;          // px radius at its "home" scale

const sName=document.getElementById('sName'), sMag=document.getElementById('sMag');
let smoothZ = 0;

function frame(){
  requestAnimationFrame(frame);
  const max = document.documentElement.scrollHeight - innerHeight;
  const zTarget = (max>0 ? scrollY/max : 0) * SCENES.length;   // 0..4 → wraps
  smoothZ += (zTarget - smoothZ) * (reduce ? 1 : .07);

  x.fillStyle = '#090a12';
  x.fillRect(0,0,W,H);

  // draw scenes from deepest (about to appear) to shallowest (flying past)
  for (let i=SCENES.length+1; i>=-1; i--){
    // find each scene's offset from current zoom, wrapped over the cycle
    let rel = (i - smoothZ);
    // wrap into [-2, SCENES.length-2) so the loop is seamless
    while (rel < -2) rel += SCENES.length;
    while (rel >= SCENES.length-2) rel -= SCENES.length;
    if (rel < -1.6 || rel > 1.6) continue;
    const scene = SCENES[((i % SCENES.length) + SCENES.length) % SCENES.length];
    const scale = Math.pow(9, -rel);          // each decade of scroll ≈ 9× zoom
    const r = BASE * scale;
    if (r < 4 || r > Math.max(W,H)*3.5) continue;
    // fade in while small, fade out as it engulfs the screen
    const aIn  = Math.min(1, Math.max(0, (r-4)/60));
    const aOut = Math.min(1, Math.max(0, (Math.max(W,H)*2.4 - r)/(Math.max(W,H)*1.1)));
    scene.draw(r, Math.min(aIn, aOut));
  }

  const idx = ((Math.round(smoothZ) % SCENES.length) + SCENES.length) % SCENES.length;
  sName.textContent = SCENES[idx].name;
  sMag.textContent = '×' + Math.pow(9, smoothZ).toExponential(1).replace('e+','e');
}
requestAnimationFrame(frame);
</script>
</body>
</html>
