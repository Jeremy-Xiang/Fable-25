<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MURANO — molten, never still</title>
<meta name="description" content="MURANO is a real-time Three.js raymarched metaball: liquid glass, refraction and Fresnel rim light, morphing slowly in 3D. Drag to orbit, click to stir the color.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505;
    --fuchsia:#c026d3;
    --gold:#e8b64a;
    --teal:#2adfc2;
    --txt:#f2eef4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:'Instrument Sans',sans-serif;overflow:hidden}
  ::selection{background:var(--fuchsia);color:#fff}
  a{color:inherit}

  #gl{position:fixed;inset:0;width:100%;height:100%;cursor:grab}
  #gl:active{cursor:grabbing}
  #gl.hidden{display:none}

  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
  header{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 2rem;pointer-events:auto}
  .m{font-family:'Gilda Display',serif;font-size:1.25rem;letter-spacing:.08em}
  .m i{color:var(--fuchsia);font-style:normal}
  nav{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
  nav a{color:var(--txt);text-decoration:none;opacity:.75;margin-left:1.6rem}
  nav a:hover,nav a:focus-visible{opacity:1;color:var(--teal)}

  .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;pointer-events:none}
  .center h1{
    font-family:'Gilda Display',serif;font-weight:400;color:var(--txt);
    font-size:clamp(1.8rem,5.4vw,3.6rem);line-height:1.28;
    text-shadow:0 2px 4px rgba(0,0,0,.9),0 4px 44px rgba(0,0,0,.85);
  }
  .center h1 em{font-style:italic;color:var(--gold)}
  .center .dir{margin-top:1.8rem;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
    opacity:.8;text-shadow:0 0 10px rgba(0,0,0,.9);transition:opacity .5s}

  footer{display:flex;justify-content:space-between;align-items:flex-end;padding:1.6rem 2rem;
    font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75;line-height:2;pointer-events:auto}
  footer a{color:var(--teal)}

  /* graceful no-WebGL fallback */
  .fallback{position:fixed;inset:0;z-index:1;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 55%, #3a0d3f 0%, #12061a 45%, #050505 78%)}
  .fallback.show{display:flex}
  .blob{width:min(60vw,420px);aspect-ratio:1;border-radius:48% 52% 45% 55%/55% 45% 55% 45%;
    background:radial-gradient(circle at 35% 30%, var(--gold), var(--fuchsia) 45%, var(--teal) 85%);
    filter:blur(2px);box-shadow:0 0 120px rgba(192,38,211,.55);
    animation:morph 9s ease-in-out infinite;}
  @keyframes morph{
    0%,100%{border-radius:48% 52% 45% 55%/55% 45% 55% 45%;transform:rotate(0deg) scale(1)}
    50%{border-radius:55% 45% 58% 42%/42% 58% 42% 58%;transform:rotate(8deg) scale(1.04)}
  }
  @media(prefers-reduced-motion:reduce){ .blob{animation:none} }

  @media(max-width:640px){ nav a{margin-left:1rem} footer{flex-direction:column;gap:.6rem;align-items:flex-start} }
</style>
</head>
<body>

<canvas id="gl" tabindex="0" aria-label="Interactive 3D molten glass metaball. Drag or use arrow keys to orbit; press and hold to stir the color."></canvas>

<div class="fallback" id="fallback"><div class="blob"></div></div>

<div class="ui">
  <header>
    <span class="m">MUR<i>ANO</i></span>
    <nav><a href="guide/">Guide</a><a href="../">Index</a></nav>
  </header>

  <div class="center">
    <div>
      <h1>Glass that forgot<br>how to <em>hold a shape.</em></h1>
      <div class="dir" id="dir">drag to orbit — press and hold to stir the color</div>
    </div>
  </div>

  <footer>
    <span>MURANO · RAYMARCHED METABALL<br>THREE.JS · ZERO GENERATED ASSETS</span>
    <span style="text-align:right">BUILT BY CLAUDE (FABLE 5)<br><a href="guide/">/GUIDE</a> · <a href="../">/INDEX</a></span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('gl');
const dir = document.getElementById('dir');

let renderer, scene, camera, mesh, uniforms;
let ok = true;
try{
  if(!window.THREE || !window.WebGLRenderingContext) throw new Error('no webgl');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
  renderer.setClearColor(0x000000, 1);
}catch(e){ ok = false; }

if(ok){
  try{
    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

    const VERT = `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

    const FRAG = `
      precision highp float;
      varying vec2 vUv;
      uniform vec2 u_res;
      uniform float u_time;
      uniform float u_yaw;
      uniform float u_pitch;
      uniform float u_stir;
      uniform float u_hue;

      mat3 rotY(float a){ float c=cos(a),s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }
      mat3 rotX(float a){ float c=cos(a),s=sin(a); return mat3(1.,0.,0., 0.,c,s, 0.,-s,c); }

      float smin(float a,float b,float k){
        float h=clamp(.5+.5*(b-a)/k,0.,1.);
        return mix(b,a,h)-k*h*(1.-h);
      }

      float map(vec3 p, float t){
        float d = 1e5;
        for(int i=0;i<5;i++){
          float fi = float(i);
          vec3 c = vec3(
            sin(t*(.55+fi*.09)+fi*2.1)*(.62+.12*sin(fi*1.7)),
            cos(t*(.47+fi*.07)+fi*1.4)*(.5+.14*cos(fi*2.3)),
            sin(t*(.4+fi*.1)+fi*3.0)*(.55+.1*sin(fi*.9))
          );
          float r = .34 + .1*sin(t*.8+fi*2.);
          d = smin(d, length(p-c)-r, .55);
        }
        return d;
      }

      vec3 normalAt(vec3 p, float t){
        vec2 e = vec2(.0015,0.);
        return normalize(vec3(
          map(p+e.xyy,t)-map(p-e.xyy,t),
          map(p+e.yxy,t)-map(p-e.yxy,t),
          map(p+e.yyx,t)-map(p-e.yyx,t)
        ));
      }

      vec3 pal(float t){
        return vec3(.55,.42,.5)+vec3(.45,.42,.4)*cos(6.2831*(vec3(1.,.85,.7)*t+vec3(.02,.33,.62)));
      }

      vec3 background(vec3 rd){
        float g = smoothstep(-.4,1.0,rd.y)*.06;
        vec3 base = mix(vec3(.01,.005,.015), vec3(.03,.01,.045), g);
        float star = pow(fract(sin(dot(floor(rd.xy*380.0),vec2(12.9898,78.233)))*43758.5453),42.0);
        base += star*.5;
        return base;
      }

      void main(){
        vec2 uv = (vUv*2.0-1.0);
        uv.x *= u_res.x/u_res.y;

        mat3 rot = rotY(u_yaw) * rotX(u_pitch);
        vec3 ro = rot * vec3(0.0,0.0,3.4);
        vec3 rd = rot * normalize(vec3(uv, -1.6));

        float t = u_time;
        float dist = 0.0;
        float hit = -1.0;
        vec3 p;
        for(int i=0;i<64;i++){
          p = ro + rd*dist;
          float d = map(p,t);
          if(d < 0.0015){ hit = dist; break; }
          dist += d*0.82;
          if(dist > 9.0) break;
        }

        vec3 col;
        if(hit > 0.0){
          vec3 n = normalAt(p,t);
          vec3 viewDir = normalize(ro-p);
          float fresnel = pow(1.0-clamp(dot(n,viewDir),0.0,1.0), 3.2);

          vec3 refr = refract(-viewDir, n, 0.78);
          vec3 refl = reflect(-viewDir, n);
          vec3 envRefr = background(refr) * 3.2;
          vec3 envRefl = background(refl) * 3.2;

          float huey = map(p,t)*1.4 + p.x*.25 + p.y*.2 + u_hue;
          vec3 tint = pal(huey);

          vec3 base = mix(envRefr*tint*1.6, envRefl, fresnel*0.8);
          base += tint * fresnel * (1.1 + u_stir*1.4);

          vec3 lightDir = normalize(vec3(0.5,0.8,0.4));
          float spec = pow(max(dot(reflect(-lightDir,n),viewDir),0.0), 40.0);
          base += vec3(1.0,0.96,0.9) * spec * (1.4+u_stir*2.0);

          col = base;
        } else {
          col = background(rd);
          col += pal(u_time*.05+u_hue) * 0.02;
        }

        vec2 q = vUv;
        col *= 1.0 - 0.45*pow(length(q-0.5),1.6);

        gl_FragColor = vec4(col, 1.0);
      }`;

    uniforms = {
      u_res: {value: new THREE.Vector2(innerWidth, innerHeight)},
      u_time: {value: 0},
      u_yaw: {value: 0.5},
      u_pitch: {value: -0.15},
      u_stir: {value: 0},
      u_hue: {value: 0}
    };

    mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(2,2),
      new THREE.ShaderMaterial({vertexShader:VERT, fragmentShader:FRAG, uniforms})
    );
    scene.add(mesh);

    function resize(){
      const w = innerWidth, h = innerHeight;
      const small = Math.min(w,h) < 700;
      const dpr = Math.min(devicePixelRatio, small ? 1 : 1.5);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w,h);
      uniforms.u_res.value.set(w,h);
    }
    addEventListener('resize', resize);
    resize();

    /* ---- orbit drag (pointer) ---- */
    let dragging=false, lastX=0, lastY=0, velYaw=0, velPitch=0;
    let yawTarget=uniforms.u_yaw.value, pitchTarget=uniforms.u_pitch.value;
    canvas.addEventListener('pointerdown', e=>{
      dragging=true; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId);
      dir.style.opacity='0';
    });
    addEventListener('pointerup', ()=>{ dragging=false; });
    addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx=(e.clientX-lastX)*.005, dy=(e.clientY-lastY)*.005;
      lastX=e.clientX; lastY=e.clientY;
      velYaw = dx; velPitch = dy;
      yawTarget += dx;
      pitchTarget = Math.max(-1.1, Math.min(1.1, pitchTarget+dy));
    });

    /* keyboard orbit for accessibility */
    canvas.addEventListener('keydown', e=>{
      const step=.12;
      if(e.key==='ArrowLeft'){ yawTarget-=step; e.preventDefault(); }
      if(e.key==='ArrowRight'){ yawTarget+=step; e.preventDefault(); }
      if(e.key==='ArrowUp'){ pitchTarget=Math.max(-1.1,pitchTarget-step); e.preventDefault(); }
      if(e.key==='ArrowDown'){ pitchTarget=Math.min(1.1,pitchTarget+step); e.preventDefault(); }
    });

    /* press-and-hold to stir color */
    let stirTarget=0;
    const stirOn = ()=>{ stirTarget=1; };
    const stirOff = ()=>{ stirTarget=0; };
    canvas.addEventListener('pointerdown', stirOn);
    addEventListener('pointerup', stirOff);
    canvas.addEventListener('keydown', e=>{ if(e.key===' '){ stirOn(); e.preventDefault(); } });
    canvas.addEventListener('keyup', e=>{ if(e.key===' ') stirOff(); });

    const t0 = performance.now();
    const speed = reduced ? 0.03 : 0.28;
    (function frame(now){
      const t = (now-t0)/1000;
      uniforms.u_time.value = t*speed;

      if(!dragging && !reduced){ yawTarget += 0.0006; } // faint ambient drift when idle
      uniforms.u_yaw.value += (yawTarget-uniforms.u_yaw.value)*(reduced?1:.12);
      uniforms.u_pitch.value += (pitchTarget-uniforms.u_pitch.value)*(reduced?1:.12);
      uniforms.u_stir.value += (stirTarget-uniforms.u_stir.value)*.08;
      uniforms.u_hue.value += 0.0008*(reduced?0.2:1.0);

      renderer.render(scene,camera);
      requestAnimationFrame(frame);
    })(0);

  }catch(e){ ok = false; console.error(e); }
}

if(!ok){
  canvas.classList.add('hidden');
  document.getElementById('fallback').classList.add('show');
  dir.textContent = 'this browser can’t run the WebGL shader — showing a CSS fallback';
}
</script>
</body>
</html>
