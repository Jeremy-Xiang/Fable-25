<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALEIDO — one line, twelve mirrors</title>
<meta name="description" content="A drawing kaleidoscope: every stroke is rotated and mirrored through up to sixteen segments as you make it. It doodles on its own until you take over.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23100a18'/%3E%3Cpath d='M16 4 L20 16 L16 28 L12 16 Z' fill='%23ff5fa8'/%3E%3Cpath d='M4 16 L16 12 L28 16 L16 20 Z' fill='%2355d6ff' opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Sometype+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#100a18;--ink:#f6eefc;--dim:#9486a6;--pink:#ff5fa8;--line:rgba(246,238,252,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Sometype Mono',monospace;height:100vh;overflow:hidden}
::selection{background:var(--pink);color:#111}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;pointer-events:none}
header *{pointer-events:auto}
.mark{font-family:'Gloock',serif;font-size:1.3rem;letter-spacing:.04em}
.mark em{font-style:normal;color:var(--pink)}
nav{display:flex;gap:1.4rem}
nav a{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:var(--pink)}
.plate{position:fixed;left:1.5rem;bottom:1.3rem;z-index:5;pointer-events:none}
.plate h1{font-family:'Gloock',serif;font-weight:400;font-size:clamp(1.4rem,3.2vw,2.2rem);line-height:1.15}
.plate h1 em{font-style:normal;color:var(--pink)}
.plate p{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:.6rem}
.deck{position:fixed;right:1.5rem;bottom:1.3rem;z-index:5;display:flex;gap:.8rem;align-items:center;background:rgba(16,10,24,.82);border:1px solid var(--line);border-radius:999px;padding:.55rem 1rem}
.deck label{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.deck label b{color:var(--pink);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:2px;background:var(--line);cursor:ew-resize}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--pink)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--pink)}
.deck button{font:inherit;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.4rem .8rem;cursor:pointer}
.deck button:hover{border-color:var(--pink);color:var(--pink)}
</style>
</head>
<body>
<canvas id="c" aria-label="Kaleidoscope drawing canvas; drag to draw mirrored strokes"></canvas>
<header><span class="mark">Kalei<em>do</em></span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<div class="plate"><h1>One line.<br><em>Twelve mirrors.</em></h1><p>drag to draw · it doodles until you do</p></div>
<div class="deck"><label>mirrors <b id="vN">12</b></label><input type="range" id="rN" min="4" max="16" step="2" value="12" aria-label="Number of mirrors"><button id="bClear">wipe</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,N=12,hue=320,user=false,last=null;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;x.fillStyle='#100a18';x.fillRect(0,0,W,H)}
function seg(x1,y1,x2,y2,w){
  const cx=W/2,cy=H/2;hue=(hue+.6)%360;
  x.strokeStyle=`hsla(${hue},92%,66%,.85)`;x.lineWidth=w;x.lineCap='round';x.shadowBlur=12;x.shadowColor=`hsla(${hue},92%,60%,.6)`;
  for(let i=0;i<N;i++){x.save();x.translate(cx,cy);x.rotate(i*Math.PI*2/N);if(i%2)x.scale(1,-1);
    x.beginPath();x.moveTo(x1-cx,y1-cy);x.lineTo(x2-cx,y2-cy);x.stroke();x.restore()}
  x.shadowBlur=0}
let t=Math.random()*100;
function auto(){const R=Math.min(W,H)*.42;t+=.014;
  const px=W/2+Math.cos(t*1.7)*R*(.35+.6*Math.sin(t*.61)),py=H/2+Math.sin(t*2.3)*R*(.3+.5*Math.cos(t*.43));
  if(last)seg(last[0],last[1],px,py,1.6+1.4*Math.sin(t*3));last=[px,py]}
function frame(){requestAnimationFrame(frame);
  x.fillStyle='rgba(16,10,24,.012)';x.fillRect(0,0,W,H);
  if(!user&&!reduce)for(let i=0;i<3;i++)auto()}
addEventListener('resize',resize);resize();
if(reduce){for(let i=0;i<900;i++)auto()}
requestAnimationFrame(frame);
let down=false,idleTimer=0;
cv.addEventListener('pointerdown',e=>{down=true;user=true;last=[e.clientX,e.clientY];clearTimeout(idleTimer)});
cv.addEventListener('pointermove',e=>{if(!down)return;seg(last[0],last[1],e.clientX,e.clientY,2.6);last=[e.clientX,e.clientY]});
addEventListener('pointerup',()=>{down=false;idleTimer=setTimeout(()=>{user=false;last=null},6000)});
document.getElementById('rN').addEventListener('input',e=>{N=+e.target.value;document.getElementById('vN').textContent=N});
document.getElementById('bClear').addEventListener('click',()=>{x.fillStyle='#100a18';x.fillRect(0,0,W,H);last=null});
</script>
</body>
</html>
