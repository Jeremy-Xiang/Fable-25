<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANABI — fire flowers over still water</title>
<meta name="description" content="A fireworks show over a harbour: click to launch a shell, watch it bloom into chrysanthemums, willows and rings, and see every spark doubled in the water below.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307060f'/%3E%3Cg stroke='%23ff6b6b' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M16 16 V6 M16 16 V26 M16 16 H6 M16 16 H26 M16 16 L9 9 M16 16 L23 23 M16 16 L23 9 M16 16 L9 23'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=M+PLUS+1+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5eee6;--dim:#948a9c;--red:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07060f;color:var(--ink);font-family:'M PLUS 1 Code',monospace;height:100vh;overflow:hidden}
::selection{background:var(--red);color:#111}
a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;pointer-events:none}
header *{pointer-events:auto}
.mark{font-family:'Shippori Mincho',serif;font-weight:700;font-size:1.25rem;letter-spacing:.2em}
.mark em{font-style:normal;color:var(--red)}
nav{display:flex;gap:1.4rem}
nav a{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:var(--red)}
.plate{position:fixed;left:1.5rem;top:4.8rem;z-index:5;pointer-events:none;writing-mode:vertical-rl}
.plate h1{font-family:'Shippori Mincho',serif;font-weight:500;font-size:clamp(1.3rem,2.6vw,1.9rem);letter-spacing:.3em}
.plate h1 em{font-style:normal;color:var(--red)}
.cap{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:5;pointer-events:none;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.cap b{color:var(--ink);font-weight:500}
</style>
</head>
<body>
<canvas id="c" aria-label="Fireworks over water; click to launch a shell"></canvas>
<header><span class="mark">HANA<em>BI</em></span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<div class="plate"><h1>花火 — <em>fire flowers</em></h1></div>
<div class="cap">click the sky to launch · shells fired <b id="n">0</b></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,HZ,shells=[],sparks=[],fired=0,idle=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;HZ=H*.74;x.fillStyle='#07060f';x.fillRect(0,0,W,H)}
function launch(tx,ty){shells.push({x:tx+(Math.random()-.5)*40,y:HZ,tx,ty:Math.min(ty,HZ-80),hue:Math.random()*360,type:Math.random()*4|0});fired++;document.getElementById('n').textContent=fired}
function burst(s){const n=s.type===2?90:190;
  for(let i=0;i<n;i++){const a=i/n*6.283+(s.type===2?0:Math.random()*.1),sp=s.type===2?4.2:1.2+Math.random()*4.4;
    sparks.push({x:s.x,y:s.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:s.type===1?.005:.008+Math.random()*.006,hue:s.type===3?s.hue+i*2.6:s.hue+(Math.random()-.5)*30,willow:s.type===1})}
  sparks.push({x:s.x,y:s.y,vx:0,vy:0,life:1,decay:.08,hue:s.hue,flash:true})}
function frame(){requestAnimationFrame(frame);
  // persistence: fade the sky, never fully clear, so trails glow
  x.globalCompositeOperation='source-over';x.fillStyle='rgba(7,6,15,.13)';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  for(const s of shells){s.y+=(s.ty-s.y)*.06-2.2;s.x+=(s.tx-s.x)*.03;
    x.fillStyle='rgba(255,220,170,.9)';x.fillRect(s.x-1,s.y,2,6);x.fillStyle='rgba(255,220,170,.25)';x.fillRect(s.x-1,HZ+(HZ-s.y)*.36,2,4);
    if(s.y<=s.ty+6){s.dead=true;burst(s)}}
  shells=shells.filter(s=>!s.dead);
  for(const p of sparks){p.vx*=.985;p.vy=p.vy*.985+(p.willow?.045:.03);p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    const a=Math.max(0,p.life);
    if(p.flash){x.fillStyle=`hsla(${p.hue},100%,90%,${a*.5})`;x.beginPath();x.arc(p.x,p.y,60*a,0,7);x.fill();continue}
    if(p.y<HZ){x.fillStyle=`hsla(${p.hue},100%,${p.willow?74:66}%,${a})`;x.fillRect(p.x-1.6,p.y-1.6,3.2,3.2)}
    // the water keeps a dimmer, slightly stretched copy
    const ry=HZ+(HZ-p.y)*.36;if(ry>HZ&&ry<H){x.fillStyle=`hsla(${p.hue},100%,66%,${a*.4})`;x.fillRect(p.x+Math.sin(ry*.2+p.life*20)*1.5,ry,3,4.4)}}
  sparks=sparks.filter(p=>p.life>0);
  x.globalCompositeOperation='source-over';
  // far shore
  x.fillStyle='#04040a';x.beginPath();x.moveTo(0,HZ);for(let px=0;px<=W;px+=24)x.lineTo(px,HZ-6-Math.abs(Math.sin(px*.013)*10)-Math.sin(px*.05)*3);x.lineTo(W,HZ+2);x.lineTo(0,HZ+2);x.fill();
  if(!reduce&&++idle>34+Math.random()*50){idle=0;launch(W*(.15+Math.random()*.7),H*(.12+Math.random()*.34))}}
addEventListener('resize',resize);resize();
cv.addEventListener('pointerdown',e=>{idle=-120;launch(e.clientX,e.clientY)});
for(let i=0;i<3;i++){const s={x:W*(.25+i*.25),y:H*(.22+Math.random()*.18),hue:[350,45,200][i],type:[0,1,3][i]};burst(s)}
if(reduce){for(let k=0;k<26;k++){for(const p of sparks){p.x+=p.vx;p.y+=p.vy;p.vy+=.03}}}
requestAnimationFrame(frame);
</script>
</body>
</html>
