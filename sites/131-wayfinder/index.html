<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAYFINDER — watch a search look for the shortest path</title>
<meta name="description" content="Shortest-path search made visible: Dijkstra spreads like water, A* leans toward the goal. Draw walls, drag the endpoints, and compare how many cells each one has to visit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101418'/%3E%3Cpath d='M7 25 V15 H17 V7 H25' fill='none' stroke='%23ffe14d' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='25' r='3' fill='%2336d399'/%3E%3Ccircle cx='25' cy='7' r='3' fill='%23ff5c8a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;900&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef2f5;--dim:#7d8b96;--yel:#ffe14d;--line:rgba(238,242,245,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#101418;color:var(--ink);font-family:'Martian Mono',monospace;height:100vh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
::selection{background:var(--yel);color:#111}
a:focus-visible,button:focus-visible{outline:2px solid var(--yel);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem}
.mark{font-family:'Archivo',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:.14em}
.mark em{font-style:normal;color:var(--yel)}
nav{display:flex;gap:1.4rem}
nav a{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:var(--yel)}
.wrap{min-height:0;padding:0 1.5rem;display:flex;align-items:center;justify-content:center}
#c{display:block;cursor:crosshair;touch-action:none;border:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 1.5rem 1.1rem}
h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(1.1rem,2.4vw,1.7rem);text-transform:uppercase;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--yel)}
.stat{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat b{color:var(--ink);font-weight:500}
.deck{display:flex;gap:.4rem;flex-wrap:wrap}
.deck button{font:inherit;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink);padding:.55rem .8rem;cursor:pointer}
.deck button:hover{border-color:var(--yel)}
.deck button[aria-pressed=true]{background:var(--yel);color:#101418;border-color:var(--yel)}
.cred{font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);width:100%}
.cred a{color:var(--yel)}
</style>
</head>
<body>
<header><span class="mark">WAY<em>FINDER</em></span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<div class="wrap"><canvas id="c" aria-label="Grid pathfinding; drag to draw walls, drag the green or pink dot to move the endpoints"></canvas></div>
<div class="bar"><h1>Watch a search <em>look for the way.</em></h1>
  <div class="stat">visited <b id="sv">0</b> · path <b id="sp">–</b> · drag to draw walls · drag a dot to move it</div>
  <div class="deck" id="deck"><button data-a="astar" aria-pressed="true">a*</button><button data-a="dijkstra" aria-pressed="false">dijkstra</button><button data-a="greedy" aria-pressed="false">greedy</button><button id="bClear">clear walls</button></div>
  <div class="cred">site 131 / fable 25 · built by claude (fable 5) · <a href="guide/">how it was made</a></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let C,R,S,wall,g,from,state,open,start,goal,algo='astar',done,path=[],visited=0,mode=null,pt=0;
function size(){const w=cv.parentElement;S=Math.max(13,Math.min(22,Math.floor((w.clientWidth-48)/58)));C=Math.floor((w.clientWidth-48)/S);R=Math.floor((w.clientHeight-4)/S);
  const D=Math.min(devicePixelRatio||1,2);cv.width=C*S*D;cv.height=R*S*D;cv.style.width=C*S+'px';cv.style.height=R*S+'px';x.setTransform(D,0,0,D,0,0)}
function init(){size();wall=new Uint8Array(C*R);start=(R/2|0)*C+(C*.14|0);goal=(R/2|0)*C+(C*.86|0);
  // a few default obstacles so the first run has something to go around
  const vline=(cx,y0,y1)=>{for(let y=y0;y<=y1;y++)if(y>=0&&y<R)wall[y*C+cx]=1};
  vline(C*.35|0,R*.15|0,R*.72|0);vline(C*.55|0,R*.3|0,R-1);vline(C*.72|0,0,R*.62|0);
  for(let i=0;i<C*R*.06;i++){const k=Math.random()*C*R|0;if(k!==start&&k!==goal)wall[k]=1}
  restart()}
const h=k=>{const dx=Math.abs(k%C-goal%C),dy=Math.abs((k/C|0)-(goal/C|0));return dx+dy};
function restart(){g=new Float32Array(C*R).fill(Infinity);from=new Int32Array(C*R).fill(-1);state=new Uint8Array(C*R);open=[start];g[start]=0;state[start]=1;done=false;path=[];visited=0;pt=0}
// priority: Dijkstra uses distance so far, greedy uses the guess to the goal, A* adds them
const pri=k=>algo==='dijkstra'?g[k]:algo==='greedy'?h(k):g[k]+h(k)*1.001;
function step(){if(done)return;if(!open.length){done=true;return}
  let bi=0;for(let i=1;i<open.length;i++)if(pri(open[i])<pri(open[bi]))bi=i;const k=open.splice(bi,1)[0];state[k]=2;visited++;
  if(k===goal){done=true;for(let c=goal;c!==-1;c=from[c])path.push(c);path.reverse();return}
  const cx=k%C,cy=k/C|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=C||ny>=R)continue;const n=ny*C+nx;if(wall[n]||state[n]===2)continue;
    if(g[k]+1<g[n]){g[n]=g[k]+1;from[n]=k;if(!state[n]){state[n]=1;open.push(n)}}}}
function draw(){x.fillStyle='#101418';x.fillRect(0,0,C*S,R*S);
  for(let k=0;k<C*R;k++){const px=(k%C)*S,py=(k/C|0)*S;
    if(wall[k]){x.fillStyle='#e9eef2';x.fillRect(px+1,py+1,S-2,S-2)}
    else if(state[k]===2){const t=Math.min(1,g[k]/(C*.9));x.fillStyle=`hsl(${200+t*110},70%,${26+t*12}%)`;x.fillRect(px+1,py+1,S-2,S-2)}
    else if(state[k]===1){x.fillStyle='#2c6f8f';x.fillRect(px+3,py+3,S-6,S-6)}
    else{x.fillStyle='rgba(238,242,245,.05)';x.fillRect(px+S/2-1,py+S/2-1,2,2)}}
  if(path.length){x.strokeStyle='#ffe14d';x.lineWidth=Math.max(3,S*.28);x.lineCap='round';x.lineJoin='round';x.beginPath();const n=Math.min(path.length,Math.ceil(pt));
    for(let i=0;i<n;i++){const k=path[i];i?x.lineTo((k%C)*S+S/2,(k/C|0)*S+S/2):x.moveTo((k%C)*S+S/2,(k/C|0)*S+S/2)}x.stroke()}
  for(const[k,c]of[[start,'#36d399'],[goal,'#ff5c8a']]){x.fillStyle=c;x.beginPath();x.arc((k%C)*S+S/2,(k/C|0)*S+S/2,S*.42,0,7);x.fill()}
  document.getElementById('sv').textContent=visited;document.getElementById('sp').textContent=done?(path.length?path.length-1+' steps':'no way through'):'searching'}
function solveNow(){restart();while(!done)step();pt=path.length;draw()}
function frame(){requestAnimationFrame(frame);for(let i=0;i<5;i++)step();if(done&&pt<path.length)pt+=1.5;draw()}
init();if(reduce)solveNow();else{for(let i=0;i<240;i++)step();requestAnimationFrame(frame)}
const cell=e=>{const r=cv.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)/S),cy=Math.floor((e.clientY-r.top)/S);return cx<0||cy<0||cx>=C||cy>=R?-1:cy*C+cx};
const again=()=>reduce?solveNow():restart();
cv.addEventListener('pointerdown',e=>{const k=cell(e);if(k<0)return;cv.setPointerCapture(e.pointerId);mode=k===start?'start':k===goal?'goal':wall[k]?'erase':'wall';if(mode==='wall'||mode==='erase'){wall[k]=mode==='wall'?1:0;again()}});
cv.addEventListener('pointermove',e=>{if(!mode)return;const k=cell(e);if(k<0||k===start||k===goal)return;
  if(mode==='start'&&!wall[k]){start=k;again()}else if(mode==='goal'&&!wall[k]){goal=k;again()}else if(mode==='wall'&&!wall[k]){wall[k]=1;again()}else if(mode==='erase'&&wall[k]){wall[k]=0;again()}});
addEventListener('pointerup',()=>mode=null);
document.getElementById('deck').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='bClear'){wall.fill(0);again();return}
  algo=b.dataset.a;document.querySelectorAll('#deck button[data-a]').forEach(q=>q.setAttribute('aria-pressed',q===b));again()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{init();if(reduce)solveNow()},200)});
</script>
</body>
</html>
