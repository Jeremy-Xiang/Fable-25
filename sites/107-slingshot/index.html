<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLINGSHOT — throw a planet, keep an orbit</title>
<meta name="description" content="An orbital sandbox: drag to aim and release to fling a planet around the star. Most throws crash or escape. The ones that stay are yours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305070d'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffd27a'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='6' fill='none' stroke='%237fb8ff' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--ink:#eaf0fb;--dim:#7c88a0;--sun:#ffd27a;--line:rgba(234,240,251,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Red Hat Mono',monospace;height:100vh;overflow:hidden}
::selection{background:var(--sun);color:#111}
a:focus-visible,button:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.5rem;pointer-events:none}
header *{pointer-events:auto}
.mark{font-family:'Michroma',sans-serif;font-size:.86rem;letter-spacing:.24em}
.mark em{font-style:normal;color:var(--sun)}
nav{display:flex;gap:1.4rem}
nav a{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:var(--sun)}
.plate{position:fixed;left:1.5rem;bottom:1.3rem;z-index:5;pointer-events:none}
.plate h1{font-family:'Michroma',sans-serif;font-weight:400;font-size:clamp(1rem,2.2vw,1.5rem);line-height:1.4;letter-spacing:.04em}
.plate h1 em{font-style:normal;color:var(--sun)}
.plate p{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:.7rem;line-height:1.9}
.plate b{color:var(--ink);font-weight:500}
.deck{position:fixed;right:1.5rem;bottom:1.3rem;z-index:5;display:flex;gap:.5rem}
.deck button{font:inherit;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;background:rgba(5,7,13,.8);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.6rem 1.05rem;cursor:pointer}
.deck button:hover{border-color:var(--sun);color:var(--sun)}
</style>
</head>
<body>
<canvas id="c" aria-label="Orbital sandbox; drag and release to launch a planet"></canvas>
<header><span class="mark">SLING<em>SHOT</em></span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<div class="plate"><h1>Throw a planet.<br><em>Keep an orbit.</em></h1><p>drag to aim, release to launch<br>in orbit <b id="nOrb">0</b> · lost to the sun <b id="nSun">0</b> · escaped <b id="nEsc">0</b></p></div>
<div class="deck"><button id="bClear">clear the system</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,cx,cy,bodies=[],stars=[],sunk=0,esc=0;const GM=5200;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;cx=W/2;cy=H/2;stars=[];for(let i=0;i<160;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()])}
function add(px,py,vx,vy){bodies.push({x:px,y:py,vx,vy,h:Math.random()*360,r:3+Math.random()*4,trail:[]})}
function circ(r,dir=1){const v=Math.sqrt(GM/r);const a=Math.random()*6.283;add(cx+Math.cos(a)*r,cy+Math.sin(a)*r,-Math.sin(a)*v*dir,Math.cos(a)*v*dir)}
function step(dt){for(const b of bodies){const dx=cx-b.x,dy=cy-b.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2),a=GM/d2;
    b.vx+=dx/d*a*dt;b.vy+=dy/d*a*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(d<16){b.dead='sun'}else if(d>Math.max(W,H)*1.6){b.dead='esc'}}
  for(const b of bodies)if(b.dead){b.dead==='sun'?sunk++:esc++}
  bodies=bodies.filter(b=>!b.dead)}
let aim=null;
function frame(){requestAnimationFrame(frame);
  if(!reduce)for(let i=0;i<4;i++)step(.05);
  x.fillStyle='#05070d';x.fillRect(0,0,W,H);
  for(const s of stars){x.fillStyle=`rgba(234,240,251,${.2+s[2]*.5})`;x.fillRect(s[0],s[1],1.2,1.2)}
  const g=x.createRadialGradient(cx,cy,0,cx,cy,90);g.addColorStop(0,'rgba(255,236,190,1)');g.addColorStop(.16,'rgba(255,210,122,.9)');g.addColorStop(.4,'rgba(255,160,70,.18)');g.addColorStop(1,'transparent');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,90,0,7);x.fill();
  for(const b of bodies){b.trail.push(b.x,b.y);if(b.trail.length>360)b.trail.splice(0,2);
    x.strokeStyle=`hsla(${b.h},80%,70%,.45)`;x.lineWidth=1;x.beginPath();
    for(let i=0;i<b.trail.length;i+=2)i?x.lineTo(b.trail[i],b.trail[i+1]):x.moveTo(b.trail[i],b.trail[i+1]);x.stroke();
    x.fillStyle=`hsl(${b.h},80%,72%)`;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}
  if(aim){x.strokeStyle='rgba(255,210,122,.9)';x.setLineDash([5,6]);x.beginPath();x.moveTo(aim.x0,aim.y0);x.lineTo(aim.x1,aim.y1);x.stroke();x.setLineDash([]);
    // predicted path
    let px=aim.x0,py=aim.y0,vx=(aim.x0-aim.x1)*.35,vy=(aim.y0-aim.y1)*.35;x.fillStyle='rgba(234,240,251,.5)';
    for(let i=0;i<90;i++){const dx=cx-px,dy=cy-py,d2=dx*dx+dy*dy,d=Math.sqrt(d2);if(d<16)break;vx+=dx/d*GM/d2*.2;vy+=dy/d*GM/d2*.2;px+=vx*.2;py+=vy*.2;if(i%3===0)x.fillRect(px,py,2,2)}
    x.fillStyle='#eaf0fb';x.beginPath();x.arc(aim.x0,aim.y0,5,0,7);x.fill()}
  document.getElementById('nOrb').textContent=bodies.length;document.getElementById('nSun').textContent=sunk;document.getElementById('nEsc').textContent=esc}
addEventListener('resize',resize);resize();
[110,170,240,320].forEach((r,i)=>circ(Math.min(r,Math.min(W,H)*.42),i%2?1:-1));
requestAnimationFrame(frame);
cv.addEventListener('pointerdown',e=>{aim={x0:e.clientX,y0:e.clientY,x1:e.clientX,y1:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(aim){aim.x1=e.clientX;aim.y1=e.clientY}});
cv.addEventListener('pointerup',()=>{if(!aim)return;add(aim.x0,aim.y0,(aim.x0-aim.x1)*.35,(aim.y0-aim.y1)*.35);aim=null});
document.getElementById('bClear').addEventListener('click',()=>{bodies=[];sunk=0;esc=0});
</script>
</body>
</html>
