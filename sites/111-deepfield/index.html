<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEEP FIELD — the coastline that never ends</title>
<meta name="description" content="A Mandelbrot explorer in one shader: click to dive toward any point, shift-click to surface. It tours Seahorse Valley on its own until you take the helm.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060814'/%3E%3Ccircle cx='19' cy='16' r='7' fill='%23ffb347'/%3E%3Ccircle cx='10' cy='16' r='3.5' fill='%23ffb347'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f1e6;--dim:#a8a08e;--amber:#ffb347;--line:rgba(246,241,230,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060814;color:var(--ink);font-family:'Fira Code',monospace;height:100vh;overflow:hidden}
::selection{background:var(--amber);color:#111}
a:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;cursor:zoom-in}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;pointer-events:none;background:linear-gradient(rgba(6,8,20,.7),transparent)}
header *{pointer-events:auto}
.mark{font-family:'Bodoni Moda',serif;font-size:1.25rem;letter-spacing:.06em}
.mark em{color:var(--amber)}
nav{display:flex;gap:1.4rem}
nav a{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:var(--amber)}
.plate{position:fixed;left:1.5rem;bottom:1.3rem;z-index:5;pointer-events:none;background:rgba(6,8,20,.72);padding:.9rem 1.1rem;border:1px solid var(--line);border-radius:10px}
.plate h1{font-family:'Bodoni Moda',serif;font-weight:500;font-size:clamp(1.2rem,2.8vw,1.9rem);line-height:1.15}
.plate h1 em{color:var(--amber)}
.plate p{font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:.6rem;line-height:1.9}
.plate b{color:var(--ink);font-weight:500}
.deck{position:fixed;right:1.5rem;bottom:1.3rem;z-index:5;display:flex;gap:.5rem}
.deck button{font:inherit;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;background:rgba(6,8,20,.8);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.6rem 1rem;cursor:pointer}
.deck button:hover{border-color:var(--amber);color:var(--amber)}
</style>
</head>
<body>
<canvas id="gl" aria-label="Mandelbrot set explorer; click to zoom in, shift-click to zoom out"></canvas>
<header><span class="mark">Deep <em>Field</em></span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<div class="plate"><h1>The coastline<br>that <em>never ends.</em></h1><p>click to dive · shift-click to surface<br>magnification <b id="mag">×1</b> · re <b id="re">-0.5</b> · im <b id="im">0</b></p></div>
<div class="deck"><button id="bTour">auto-tour</button><button id="bHome">surface</button></div>
<script>
const cv=document.getElementById('gl'),gl=cv.getContext('webgl');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;uniform vec2 res,c0;uniform float scale,t;
void main(){vec2 uv=(gl_FragCoord.xy-.5*res)/res.y;vec2 c=c0+uv*scale;vec2 z=vec2(0.);float n=0.;
  for(int i=0;i<300;i++){z=vec2(z.x*z.x-z.y*z.y,2.*z.x*z.y)+c;if(dot(z,z)>64.){break;}n+=1.;}
  if(n>=300.){gl_FragColor=vec4(.02,.02,.05,1.);return;}
  float s=n-log2(log2(dot(z,z)))+4.;                       // smooth iteration count
  vec3 col=.5+.5*cos(3.+s*.12+t*.05+vec3(0.,.6,1.1));    // cosine palette
  col*=vec3(1.1,.85,.6);col=mix(vec3(.02,.03,.08),col,smoothstep(0.,14.,s));
  gl_FragColor=vec4(col,1.);}`;
function sh(ty,s){const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n),uRes=U('res'),uC=U('c0'),uS=U('scale'),uT=U('t');
function resize(){const d=Math.min(devicePixelRatio||1,1.5);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(uRes,cv.width,cv.height)}
addEventListener('resize',resize);resize();
const HOME={x:-.5,y:0,s:2.6};
const TOUR=[{x:-.743643,y:.131825,s:.0006},{x:-.1011,y:.9563,s:.004},{x:-1.25066,y:.02012,s:.0004},{x:.2826,y:.0101,s:.003}];
let cur={...HOME},tgt={...HOME},touring=true,ti=0,hold=0;
function frame(){requestAnimationFrame(frame);
  const k=reduce?1:.03;
  // move center faster than scale so dives feel like falling toward a point
  cur.x+=(tgt.x-cur.x)*Math.min(1,k*2.2);cur.y+=(tgt.y-cur.y)*Math.min(1,k*2.2);
  cur.s*=Math.pow(tgt.s/cur.s,k);
  if(touring&&!reduce&&Math.abs(Math.log(cur.s/tgt.s))<.05&&++hold>150){hold=0;tgt=tgt.s<1?{...HOME}:{...TOUR[ti++%TOUR.length]}}
  gl.uniform2f(uC,cur.x,cur.y);gl.uniform1f(uS,cur.s);gl.uniform1f(uT,reduce?0:performance.now()/1000);gl.drawArrays(gl.TRIANGLES,0,3);
  document.getElementById('mag').textContent='×'+(2.6/cur.s).toFixed(cur.s>.1?1:0);
  document.getElementById('re').textContent=cur.x.toFixed(5);document.getElementById('im').textContent=cur.y.toFixed(5)}
if(reduce)tgt=cur={...TOUR[0],s:.02};else tgt={...TOUR[0]};
requestAnimationFrame(frame);
cv.addEventListener('click',e=>{touring=false;const ux=(e.clientX-innerWidth/2)/innerHeight,uy=-(e.clientY-innerHeight/2)/innerHeight;
  const out=e.shiftKey;tgt={x:cur.x+ux*cur.s,y:cur.y+uy*cur.s,s:Math.min(3,Math.max(2e-5,cur.s*(out?3:.3)))}});
document.getElementById('bHome').addEventListener('click',()=>{touring=false;tgt={...HOME}});
document.getElementById('bTour').addEventListener('click',()=>{touring=true;hold=999});
</script>
</body>
</html>
