<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARALLEL — six dimensions on one sheet</title>
<meta name="description" content="Parallel coordinates: 180 imaginary coffees, each drawn as one line crossing six axes. Drag along any axis to keep only the coffees in that range and watch the patterns between the others emerge.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f5efe6'/%3E%3Cpath d='M6 4 V28 M16 4 V28 M26 4 V28' stroke='%23333' stroke-width='1.4'/%3E%3Cpath d='M6 9 L16 20 L26 8 M6 22 L16 11 L26 24 M6 15 L16 16 L26 15' fill='none' stroke='%23b5532a' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Inconsolata:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe6;--ink:#2a211b;--dim:#93877a;--line:rgba(42,33,27,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Fraunces',serif;height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto}
::selection{background:#b5532a;color:#fff}
a:focus-visible,button:focus-visible{outline:2px solid #b5532a;outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.6rem}
.mark{font-weight:700;font-size:1.35rem}
nav{display:flex;gap:1.4rem}
nav a{font-family:'Inconsolata',monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav a:hover{color:#b5532a}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;padding:0 1.6rem .4rem}
h1{font-weight:400;font-size:clamp(1.9rem,4.6vw,3.4rem);line-height:1}
h1 em{color:#b5532a}
.read{font-family:'Inconsolata',monospace;font-size:.82rem;color:var(--dim);text-align:right;line-height:1.6}
.read b{color:var(--ink);font-weight:600}
.read button{font:inherit;background:none;border:1px solid var(--ink);color:var(--ink);padding:.25rem .7rem;cursor:pointer;margin-left:.6rem}
.read button:hover{background:var(--ink);color:var(--bg)}
.wrap{min-height:0}
#c{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem;padding:.6rem 1.6rem 1.1rem;font-family:'Inconsolata',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
footer a{color:#b5532a}
footer i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 .35rem 0 .9rem;vertical-align:-1px}
</style>
</head>
<body>
<header><span class="mark">Parallel</span><nav><a href="guide/">Guide</a><a href="../">Index</a></nav></header>
<div class="top"><h1>Six dimensions on <em>one sheet.</em></h1><div class="read"><b id="n">180</b> of 180 coffees<button id="clr">clear filters</button><br>drag up or down along any axis to filter</div></div>
<div class="wrap"><canvas id="c" aria-label="Parallel coordinates plot of 180 coffees across six measures; drag on an axis to filter"></canvas></div>
<footer><span>invented coffees<i style="background:#b5532a"></i>highland washed<i style="background:#2f6f8f"></i>island natural<i style="background:#6a7f2a"></i>valley honey</span><span>site 146 / fable 25 · built by claude (fable 5) · <a href="guide/">how it was made</a></span></footer>
<script>
const DIMS=[['Altitude','m',900,2300],['Acidity','/10',1,10],['Sweetness','/10',1,10],['Body','/10',1,10],['Roast','/10',1,10],['Price','$/kg',8,60]];
const COL=['#b5532a','#2f6f8f','#6a7f2a'];
let seed=21;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,g=()=>(rnd()+rnd()+rnd()-1.5)/1.5;
// three families with different centres; price follows altitude and sweetness, roast hides acidity
const CEN=[[1950,8,6,4,3],[1250,5,8.4,6.5,5],[1550,6,7,8,6.5]];
const rows=[];for(let i=0;i<180;i++){const k=i%3,c=CEN[k],alt=c[0]+g()*230,roast=Math.max(1,Math.min(10,c[4]+g()*2.2)),acid=Math.max(1,Math.min(10,c[1]+g()*1.3-(roast-c[4])*.45)),sweet=Math.max(1,Math.min(10,c[2]+g()*1.4)),body=Math.max(1,Math.min(10,c[3]+g()*1.3+(roast-c[4])*.3));
  rows.push({k,v:[Math.max(900,Math.min(2300,alt)),acid,sweet,body,roast,Math.max(8,Math.min(60,6+(alt-900)/1400*26+sweet*1.9+g()*5))]})}
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,D,yTop,bot,ax=[],brush=DIMS.map(()=>null),drag=null,hover=null;
function resize(){D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);yTop=58;bot=H-34;ax=DIMS.map((d,i)=>70+i/(DIMS.length-1)*(W-140))}
const Y=(i,v)=>bot-(v-DIMS[i][2])/(DIMS[i][3]-DIMS[i][2])*(bot-yTop),V=(i,y)=>DIMS[i][2]+(bot-y)/(bot-yTop)*(DIMS[i][3]-DIMS[i][2]);
const keep=r=>brush.every((b,i)=>!b||(r.v[i]>=Math.min(b[0],b[1])&&r.v[i]<=Math.max(b[0],b[1])));
function path(r){x.beginPath();r.v.forEach((v,i)=>{const px=ax[i],py=Y(i,v);if(!i){x.moveTo(px,py);return}const m=(ax[i-1]+px)/2;x.bezierCurveTo(m,Y(i-1,r.v[i-1]),m,py,px,py)});x.stroke()}
function draw(){x.clearRect(0,0,W,H);let n=0;x.lineWidth=1;x.strokeStyle='rgba(42,33,27,.07)';for(const r of rows)if(!keep(r))path(r);
  x.lineWidth=1.3;for(const r of rows)if(keep(r)){n++;x.strokeStyle=COL[r.k];x.globalAlpha=hover?(r===hover?1:.12):.5;path(r)}
  if(hover){x.globalAlpha=1;x.lineWidth=3;x.strokeStyle=COL[hover.k];path(hover)}x.globalAlpha=1;
  DIMS.forEach((d,i)=>{x.strokeStyle='#2a211b';x.lineWidth=1.4;x.beginPath();x.moveTo(ax[i],yTop);x.lineTo(ax[i],bot);x.stroke();
    x.fillStyle='#2a211b';x.font='700 17px Fraunces,serif';x.textAlign='center';x.textBaseline='alphabetic';x.fillText(d[0],ax[i],yTop-30);x.font='13px Inconsolata,monospace';x.fillStyle='#93877a';x.fillText(d[3]+' '+d[1],ax[i],yTop-12);x.fillText(d[2],ax[i],bot+20);
    if(brush[i]){const y0=Y(i,Math.max(brush[i][0],brush[i][1])),y1=Y(i,Math.min(brush[i][0],brush[i][1]));x.fillStyle='rgba(42,33,27,.12)';x.fillRect(ax[i]-11,y0,22,y1-y0);x.strokeStyle='#2a211b';x.lineWidth=1.5;x.strokeRect(ax[i]-11,y0,22,y1-y0)}
    if(hover){x.fillStyle=COL[hover.k];x.font='600 13px Inconsolata,monospace';x.textAlign='left';const v=hover.v[i];x.fillText(i===0?Math.round(v):v.toFixed(1),ax[i]+8,Y(i,v)-6)}});
  document.getElementById('n').textContent=n}
addEventListener('resize',()=>{resize();draw()});resize();
brush[5]=[38,60];draw(); // open with the expensive ones selected, so the technique explains itself
const axisAt=mx=>{let k=-1;ax.forEach((a,i)=>{if(Math.abs(a-mx)<26)k=i});return k};
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),i=axisAt(e.clientX-r.left);if(i<0)return;cv.setPointerCapture(e.pointerId);const v=V(i,Math.max(yTop,Math.min(bot,e.clientY-r.yTop)));drag=i;brush[i]=[v,v];hover=null;draw()});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.yTop;if(drag!==null){brush[drag][1]=V(drag,Math.max(yTop,Math.min(bot,my)));draw();return}
  // nearest kept line at this x
  let seg=0;while(seg<ax.length-2&&mx>ax[seg+1])seg++;const t=Math.max(0,Math.min(1,(mx-ax[seg])/(ax[seg+1]-ax[seg]))),s=t*t*(3-2*t);let b=null,bd=12;
  for(const q of rows){if(!keep(q))continue;const y=Y(seg,q.v[seg])+(Y(seg+1,q.v[seg+1])-Y(seg,q.v[seg]))*s,d=Math.abs(y-my);if(d<bd){bd=d;b=q}}if(b!==hover){hover=b;draw()}});
addEventListener('pointerup',()=>{if(drag!==null){if(Math.abs(Y(drag,brush[drag][0])-Y(drag,brush[drag][1]))<4)brush[drag]=null;drag=null;draw()}});
cv.addEventListener('pointerleave',()=>{if(hover){hover=null;draw()}});
document.getElementById('clr').addEventListener('click',()=>{brush=DIMS.map(()=>null);draw()});
</script>
</body>
</html>
