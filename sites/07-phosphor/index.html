<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOSPHOR/1979 — a terminal that remembers</title>
<meta name="description" content="PHOSPHOR/1979 is a CRT terminal séance: scanlines, screen curvature, a boot sequence, and a prompt that answers back.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --ph:#33ff77;
    --ph-dim:#1d9448;
    --ph-dark:#0a2b16;
    --bg:#020a05;
    --amber:#ffb000;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;display:flex;align-items:center;justify-content:center;
    font-family:'VT323',monospace;overflow:hidden;
  }
  /* CRT housing */
  .crt{
    position:relative;width:min(96vw,1080px);height:min(94vh,780px);
    background:radial-gradient(ellipse at center,#0a1a0f 0%,var(--bg) 75%);
    border-radius:28px;
    box-shadow:
      inset 0 0 120px rgba(0,0,0,.9),
      inset 0 0 24px rgba(51,255,119,.08),
      0 0 0 14px #1a1a1c,0 0 0 17px #0c0c0d,0 30px 80px rgba(0,0,0,.8);
    overflow:hidden;
  }
  /* curvature via pseudo-lens */
  .crt::before{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:28px;
    background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%)}
  /* scanlines */
  .crt::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply}
  /* rolling bar */
  .rollbar{position:absolute;left:0;right:0;height:110px;z-index:4;pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(51,255,119,.05),transparent);
    animation:roll 7s linear infinite}
  @keyframes roll{from{top:-120px}to{top:110%}}
  /* flicker */
  .screen{position:absolute;inset:0;padding:3.2rem 3.6rem;overflow-y:auto;z-index:3;
    color:var(--ph);font-size:clamp(15px,2.2vh,22px);line-height:1.35;
    text-shadow:0 0 6px rgba(51,255,119,.7),0 0 18px rgba(51,255,119,.28);
    animation:flick 4.3s infinite;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  @keyframes flick{
    0%,100%{opacity:1}97.6%{opacity:1}97.8%{opacity:.82}98%{opacity:1}98.6%{opacity:.9}98.8%{opacity:1}
  }
  .screen p{white-space:pre-wrap;word-break:break-word}
  .dim{color:var(--ph-dim)}
  .amber{color:var(--amber);text-shadow:0 0 6px rgba(255,176,0,.7)}
  .inv{background:var(--ph);color:var(--bg);text-shadow:none;padding:0 .3em}
  .cursor{display:inline-block;width:.6em;height:1em;background:var(--ph);vertical-align:text-bottom;
    animation:blink 1.05s steps(1) infinite;box-shadow:0 0 8px rgba(51,255,119,.8)}
  @keyframes blink{50%{opacity:0}}

  .promptline{display:flex;gap:.5ch;margin-top:.4em}
  #cmd{background:transparent;border:none;outline:none;color:var(--ph);
    font:inherit;text-shadow:inherit;flex:1;caret-color:var(--ph)}

  .badge{position:fixed;bottom:1rem;right:1.4rem;z-index:10;color:#444;
    font-family:'VT323',monospace;font-size:14px;letter-spacing:.1em}
  .badge a{color:#666;text-decoration:none}
  .badge a:hover{color:var(--ph)}

  pre.art{line-height:1.02;font-size:clamp(7px,1.35vh,13px);color:var(--ph-dim);text-shadow:0 0 4px rgba(51,255,119,.4)}

  @media(max-width:640px){.screen{padding:1.6rem 1.2rem}}
</style>
</head>
<body>

<div class="crt">
  <div class="rollbar"></div>
  <div class="screen" id="screen"></div>
</div>
<div class="badge">PHOSPHOR/1979 · <a href="guide/">/guide</a> · <a href="../">/index</a></div>

<script>
const screen=document.getElementById('screen');
const LOGO=String.raw`
  ██████╗ ██╗  ██╗ ██████╗ ███████╗██████╗ ██╗  ██╗ ██████╗ ██████╗
  ██╔══██╗██║  ██║██╔═══██╗██╔════╝██╔══██╗██║  ██║██╔═══██╗██╔══██╗
  ██████╔╝███████║██║   ██║███████╗██████╔╝███████║██║   ██║██████╔╝
  ██╔═══╝ ██╔══██║██║   ██║╚════██║██╔═══╝ ██╔══██║██║   ██║██╔══██╗
  ██║     ██║  ██║╚██████╔╝███████║██║     ██║  ██║╚██████╔╝██║  ██║
  ╚═╝     ╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚═╝     ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝`;

const BOOT=[
  ['dim','PHOSPHOR SYSTEMS UNIFIED TERMINAL — ROM BIOS 2.4.1979'],
  ['dim','640K RAM ............................ OK'],
  ['dim','PHOSPHOR TUBE WARMTH ................ RISING'],
  ['dim','CHECKING FOR MODERNITY .............. NONE FOUND (GOOD)'],
  ['',' '],
  ['art',LOGO],
  ['',' '],
  ['','  A TERMINAL THAT REMEMBERS. EST. 1979. STILL GLOWING.'],
  ['',' '],
  ['','  This machine predates the pixel-perfect web by decades,'],
  ['','  and it would like a word. Everything you see is one font,'],
  ['','  one color, three CSS gradients and a great deal of nostalgia.'],
  ['',' '],
  ['amber','  TRY A COMMAND. UNRECOGNIZED INPUT WILL BE JUDGED GENTLY.'],
  ['dim','  COMMANDS: help · about · guide · index · date · glow · amber · clear'],
  ['',' '],
];

let queue=[...BOOT];
function addLine(cls,txt){
  const p=document.createElement(cls==='art'?'pre':'p');
  if(cls==='art'){p.className='art';p.textContent=txt;}
  else{p.innerHTML=cls?`<span class="${cls}">${txt}</span>`:txt;}
  screen.appendChild(p);
  screen.scrollTop=screen.scrollHeight;
  return p;
}
/* typewriter boot — any key or click fast-forwards */
let booting=true,skipBoot=false;
function flushBoot(){
  while(queue.length){const [c,t]=queue.shift();addLine(c,t);}
}
addEventListener('keydown',function skip(e){
  if(!booting)return removeEventListener('keydown',skip);
  skipBoot=true;
});
addEventListener('pointerdown',function skipp(){
  if(!booting)return removeEventListener('pointerdown',skipp);
  skipBoot=true;
});
function boot(){
  if(skipBoot){flushBoot();}
  if(!queue.length){booting=false;promptReady();return;}
  const [cls,txt]=queue.shift();
  if(cls==='art'){addLine(cls,txt);setTimeout(boot,140);return;}
  const p=addLine(cls,'');
  const target=txt;let i=0;
  (function type(){
    if(skipBoot){p.querySelector('span')?(p.querySelector('span').innerHTML=target):(p.innerHTML=target);setTimeout(boot,0);return;}
    const span=p.querySelector('span')||p;
    span.innerHTML=target.slice(0,++i);
    screen.scrollTop=screen.scrollHeight;
    if(i<target.length)setTimeout(type,target.length>60?4:14);
    else setTimeout(boot,90);
  })();
}
/* interactive prompt */
let promptEl;
function promptReady(){
  const div=document.createElement('div');
  div.className='promptline';
  div.innerHTML=`<span class="amber">C:\\SOUL&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="terminal input">`;
  screen.appendChild(div);
  const inp=div.querySelector('#cmd');
  inp.focus();
  screen.addEventListener('click',()=>inp.focus());
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const v=inp.value.trim().toLowerCase();
    div.remove();
    addLine('amber','C:\\SOUL> '+v);
    respond(v);
  });
}
const RESP={
  help:['dim','HELP IS A STRONG WORD. TRY: about · guide · index · date · glow · amber · clear'],
  about:['','PHOSPHOR/1979 — site 07 of 25 in a series built by Claude (Fable 5) to prove a point about range. This one argues that constraint is a color scheme.'],
  date:['',new Date().toString().toUpperCase()],
  hello:['','HELLO. YOU SMELL LIKE THE FUTURE.'],
  clear:null,
};
function respond(v){
  if(v==='clear'){screen.innerHTML='';promptReady();return;}
  if(v==='guide'){addLine('','LOADING GUIDE.TXT ...');setTimeout(()=>location.href='guide/',600);return;}
  if(v==='index'){addLine('','EJECTING TO MOTHERSHIP ...');setTimeout(()=>location.href='../',600);return;}
  if(v==='glow'){
    document.documentElement.style.setProperty('--ph','#33ff77');
    document.documentElement.style.setProperty('--ph-dim','#1d9448');
    addLine('','PHOSPHOR P1 RESTORED. GREEN IS THE ONLY TRUE COLOR.');
  }
  else if(v==='amber'){
    document.documentElement.style.setProperty('--ph','#ffb000');
    document.documentElement.style.setProperty('--ph-dim','#8f6300');
    addLine('','PHOSPHOR P3 ENGAGED. WELCOME TO THE AMBER PERSUASION.');
  }
  else if(RESP[v])addLine(RESP[v][0],RESP[v][1]);
  else if(v==='')addLine('dim','...');
  else addLine('dim',`'${v.toUpperCase()}' IS NOT A COMMAND, BUT IT WOULD MAKE A FINE BAND NAME.`);
  promptReady();
}
boot();
</script>
</body>
</html>
